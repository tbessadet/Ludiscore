<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="Carnet de scores pour vos parties de jeux de société">
<title>Ludiscore</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{
  --bg:#f4f5fb;--card:#ffffff;--card2:#f8f9fd;--text:#1d1f2b;--muted:#6b7085;--line:#e3e5ee;
  --primary:#4f46e5;--primary-2:#6d5efc;--primary-soft:#ecebfe;--on-primary:#fff;
  --ok:#16a34a;--warn:#c2410c;--danger:#dc2626;--gold:#e6a700;
  --radius:16px;--shadow:0 1px 2px rgba(20,20,50,.05),0 4px 16px rgba(20,20,50,.06);
}
[data-theme=dark]{
  --bg:#0f1117;--card:#1a1d27;--card2:#151821;--text:#eceef6;--muted:#9aa0b4;--line:#2b2f3e;
  --primary:#8b80ff;--primary-2:#a79dff;--primary-soft:#26234a;--on-primary:#0f1117;--shadow:none;--gold:#ffc83d;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-tap-highlight-color:transparent}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--primary)}
.hidden,[hidden]{display:none!important}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11px}.b{font-weight:600}
.center{text-align:center}.right{text-align:right}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* Top bar */
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;background:var(--bg)}
.topbar h1{font-size:21px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.2px}
.iconbtn{width:40px;height:40px;flex:none;border-radius:12px;border:0;background:var(--card);color:var(--text);font-size:18px;box-shadow:var(--shadow);display:grid;place-items:center}
main{max-width:680px;margin:0 auto;padding:2px 14px calc(120px + env(safe-area-inset-bottom))}
/* Tab bar */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--line);padding:6px 4px calc(6px + env(safe-area-inset-bottom))}
.tabbar a{flex:1;max-width:120px;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:3px 0;border-radius:12px}
.tabbar a .i{display:block;font-size:21px;line-height:1.25;filter:grayscale(.7);opacity:.8}
.tabbar a.active{color:var(--primary);font-weight:700}
.tabbar a.active .i{filter:none;opacity:1}
.fab{position:fixed;right:16px;bottom:calc(74px + env(safe-area-inset-bottom));z-index:31;height:54px;padding:0 20px;border-radius:27px;border:0;background:var(--primary);color:var(--on-primary);font-size:16px;font-weight:700;box-shadow:0 6px 18px rgba(79,70,229,.38)}
/* Cards & lists */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px;margin:12px 0}
.card h2,.sec{font-size:16px;margin:0 0 10px}
.sec{margin:22px 2px 8px;font-size:15px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-weight:700}
.banner{border-radius:14px;padding:12px 14px;margin:10px 0;display:flex;gap:10px;align-items:center;background:var(--primary-soft)}
.banner.warn{background:color-mix(in srgb,var(--warn) 14%,var(--card))}
.banner .grow{font-size:14px}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.item .t{font-weight:600}
.item .s{font-size:13px;color:var(--muted)}
.chev{color:var(--muted);font-size:20px}
.empty{text-align:center;padding:34px 16px;color:var(--muted)}
.empty .big{font-size:46px;margin-bottom:6px}
/* Avatars & icons */
.av{display:inline-grid;place-items:center;border-radius:50%;color:#fff;font-weight:700;flex:none;line-height:1}
.gi{width:40px;height:40px;border-radius:12px;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-size:21px}
/* Badges & pills */
.badge{max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:600;padding:2px 8px;border-radius:999px;background:color-mix(in srgb,var(--c) 16%,transparent);color:color-mix(in srgb,var(--c) 75%,var(--text));white-space:nowrap}
.pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.pill{font-size:12.5px;padding:2px 8px;border-radius:999px;background:var(--card2);border:1px solid var(--line);white-space:nowrap}
.pill.win{background:color-mix(in srgb,var(--gold) 20%,var(--card));border-color:color-mix(in srgb,var(--gold) 50%,transparent);font-weight:700}
.pill.lose{background:color-mix(in srgb,var(--danger) 12%,var(--card));border-color:transparent}
/* Buttons */
.btn{border:0;border-radius:12px;padding:11px 16px;background:var(--card2);color:var(--text);font-weight:600;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.ghost{background:transparent;border-color:transparent;color:var(--primary)}
.btn.outline-danger{background:transparent;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,transparent)}
.btn.small{padding:6px 11px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btns .btn{flex:1}
/* Chips */
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px 6px 6px;display:inline-flex;align-items:center;gap:6px;font-size:14px}
.chip.noav{padding-left:12px}
.chip.on{background:var(--primary-soft);border-color:var(--primary);font-weight:700}
.seg{display:flex;gap:6px;overflow-x:auto;padding:2px 0 6px;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;color:var(--muted)}
.seg button.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
/* Forms */
label.f{display:block;margin:12px 0 0;font-size:13.5px;font-weight:600;color:var(--muted)}
label.f>input,label.f>select,label.f>textarea{margin-top:5px}
input[type=text],input[type=number],input[type=search],input[type=datetime-local],input:not([type]),select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:13px;margin-top:5px;min-height:0}
.hint.err{color:var(--danger);font-weight:600}.hint.warn{color:var(--warn);font-weight:600}.hint.ok{color:var(--ok)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.radios{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.radio{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:12px;padding:9px 11px;background:var(--card)}
.radio.on{border-color:var(--primary);background:var(--primary-soft)}
.radio input{margin-top:4px;accent-color:var(--primary)}
.radio .d{font-size:12.5px;color:var(--muted)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sw{width:34px;height:34px;border-radius:50%;border:3px solid transparent;outline:2px solid transparent}
.sw.on{border-color:var(--card);outline-color:var(--text)}
.emo{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:20px}
.emo.on{border-color:var(--primary);background:var(--primary-soft)}
/* Score rows */
.srow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow:last-child{border-bottom:0}
.srow .nm{flex:1;min-width:0;font-weight:600}
.srow input{width:110px;text-align:right;font-size:18px;font-weight:700;padding:9px 10px}
.sign{width:42px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:800;font-size:18px}
.sign.neg{background:color-mix(in srgb,var(--danger) 15%,var(--card));color:var(--danger);border-color:var(--danger)}
.crown{border:1px solid var(--line);background:var(--card2);border-radius:12px;padding:9px 14px;font-weight:700}
.crown.on{background:color-mix(in srgb,var(--gold) 25%,var(--card));border-color:var(--gold)}
.teamsel{display:flex;gap:4px}
.teamsel button{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card2);font-weight:800}
.teamsel button.on{color:#fff;border-color:transparent}
.bigchoice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bigchoice button{padding:18px 10px;border-radius:14px;border:2px solid var(--line);background:var(--card);font-size:17px;font-weight:700}
.bigchoice button.on.w{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--card))}
.bigchoice button.on.l{border-color:var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--card))}
.chosen{display:flex;align-items:center;gap:12px}
.savebar{position:sticky;bottom:calc(66px + env(safe-area-inset-bottom));z-index:15;background:var(--bg);padding:8px 0 6px;margin-top:8px;box-shadow:0 -10px 12px -10px rgba(0,0,0,.12)}
#nmErr:empty{display:none}
.msgs{font-size:13.5px;margin:4px 0 8px}
.msgs div{margin:2px 0}
.msgs .e{color:var(--danger)}.msgs .w{color:var(--warn)}
.preview{display:flex;flex-direction:column;gap:4px}
.prow{display:flex;gap:8px;align-items:center;font-size:14.5px}
.prow .rk{width:28px;text-align:center;font-size:17px}
/* Tiles, tables, bars */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
.tile{background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow)}
.tile .v{font-size:23px;font-weight:800;letter-spacing:-.5px}
.tile .l{font-size:12px;color:var(--muted);font-weight:600}
.tblwrap{overflow-x:auto;margin:0 -4px}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);text-align:right;padding:6px 5px;font-weight:700;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px 5px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
.tbl tr.click{cursor:pointer}
.tbl th.sortable{cursor:pointer}.tbl th.sorted{color:var(--primary)}
.bar{height:8px;border-radius:5px;background:var(--line);overflow:hidden;display:flex;margin-top:4px;min-width:60px}
.bar>span{height:100%;display:block}
.lb{display:flex;flex-direction:column;gap:6px}
.lbrow{display:grid;grid-template-columns:30px 1fr auto;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.lbrow .pos{font-size:18px;font-weight:800;text-align:center;color:var(--muted)}
.lbrow .big{font-size:19px;font-weight:800;text-align:right}
.lbrow .sub{font-size:12px;color:var(--muted)}
.form{display:inline-flex;gap:3px;vertical-align:middle}
.form i{width:9px;height:9px;border-radius:50%;background:var(--line);display:inline-block}
.form i.w{background:var(--ok)}.form i.l{background:color-mix(in srgb,var(--danger) 55%,var(--line))}
.h2h{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;text-align:center}
.h2h .sc{font-size:34px;font-weight:800;letter-spacing:-1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:4px;vertical-align:-1px}
.mx td,.mx th{text-align:center!important;padding:6px 4px}
.mx td.c{font-weight:700;border-radius:6px}
/* Match cards */
.match{display:flex;gap:12px;align-items:flex-start;background:var(--card);border-radius:14px;padding:11px 12px;box-shadow:var(--shadow);border:0;width:100%;text-align:left}
.mbody{flex:1;min-width:0}
.mtitle{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.month{font-size:13px;font-weight:700;color:var(--muted);margin:16px 2px 6px;text-transform:capitalize}
/* Game grid */
.ggrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.gcard{background:var(--card);border-radius:14px;box-shadow:var(--shadow);border:0;padding:0;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.gcard .img{aspect-ratio:4/3;display:grid;place-items:center;font-size:38px;overflow:hidden}
.gcard .img img{width:100%;height:100%;object-fit:cover;display:block}
.gcard .c{padding:8px 10px 10px}
.gcard .n{font-weight:700;font-size:14.5px;line-height:1.25}
.hero{display:flex;gap:14px;align-items:center}
.hero .gi,.hero img.gi{width:72px;height:72px;font-size:36px;border-radius:18px}
.hero h2{margin:0;font-size:21px}
/* Sheet / dialog / toast */
.overlay{position:fixed;inset:0;z-index:50;background:rgba(10,10,25,.5);display:none;align-items:flex-end;justify-content:center}
.overlay.open{display:flex;animation:fade .15s}
.panel{background:var(--bg);width:100%;max-width:680px;max-height:92vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .2s ease-out}
.panel .grab{width:42px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.panel h2{margin:4px 0 6px;font-size:20px}
#dialog{z-index:60;align-items:center;padding:20px}
#dialog .panel{border-radius:20px;max-width:420px;padding:18px}
@keyframes up{from{transform:translateY(40px);opacity:.5}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(140px + env(safe-area-inset-bottom));z-index:70;background:#22243a;color:#fff;border-radius:14px;padding:11px 14px;display:flex;gap:14px;align-items:center;max-width:92vw;box-shadow:0 8px 24px rgba(0,0,0,.25);opacity:0;pointer-events:none;transition:.2s;font-size:14.5px}
#toast.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#toast button{background:transparent;border:0;color:#a5b4fc;font-weight:800;padding:2px 4px;text-transform:uppercase;font-size:13px}
/* Help */
.help h3{margin:20px 0 6px;font-size:17px}
.help p,.help li{font-size:15px}
.help ul,.help ol{padding-left:22px;margin:6px 0}
.help .tip{background:var(--primary-soft);border-radius:12px;padding:10px 12px;font-size:14px;margin:10px 0}
.welcome{text-align:center;padding:26px 6px}
.welcome .logo{font-size:64px}
.welcome h2{font-size:26px;margin:6px 0}
details.arch summary{cursor:pointer;color:var(--muted);font-weight:600;padding:8px 2px}
</style>
</head>
<body>
<header class="topbar">
  <button class="iconbtn" id="back" data-act="back" aria-label="Retour" hidden>←</button>
  <h1 id="title">Ludiscore</h1>
  <button class="iconbtn" data-act="go" data-to="#/help" aria-label="Guide">?</button>
  <button class="iconbtn" data-act="go" data-to="#/settings" aria-label="Réglages">⚙️</button>
</header>
<main id="view"></main>
<button class="fab" id="fab" data-act="new-match">＋ Partie</button>
<nav class="tabbar">
  <a href="#/home" data-tab="home"><span class="i">🏠</span>Accueil</a>
  <a href="#/matches" data-tab="matches"><span class="i">📜</span>Parties</a>
  <a href="#/stats" data-tab="stats"><span class="i">📊</span>Stats</a>
  <a href="#/games" data-tab="games"><span class="i">🎲</span>Jeux</a>
  <a href="#/players" data-tab="players"><span class="i">👥</span>Joueurs</a>
</nav>
<div class="overlay" id="sheet"><div class="panel"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div class="overlay" id="dialog"><div class="panel" id="dialogBody"></div></div>
<div id="toast"></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>

<script>
'use strict';
/* =========================================================
   LUDISCORE — carnet de parties de jeux de société
   Données stockées sur l'appareil (localStorage).
   ========================================================= */
const APP_VERSION = '1.0.0';
const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
const FRAME_BANNER = '<div class="banner warn small"><div class="grow">👀 <b>Version d’aperçu.</b> Ici, la sauvegarde, le téléchargement et l’installation sont bloqués et les données peuvent disparaître. Pour un vrai usage, installe l’appli sur ton téléphone (voir le guide d’installation).</div></div>';
const STORE_KEY = 'ludiscore.data.v1';
const DRAFT_KEY = 'ludiscore.draft.v1';
const UI_KEY = 'ludiscore.ui.v1';

/* ---------- Catégories prédéfinies (18) ---------- */
const BASE_CATS = [
  {id:'strategie', name:'Stratégie', emoji:'♟️', color:'#4f46e5'},
  {id:'familial', name:'Familial', emoji:'🏡', color:'#16a34a'},
  {id:'ambiance', name:'Ambiance / Party', emoji:'🎉', color:'#ec4899'},
  {id:'cartes', name:'Cartes', emoji:'🃏', color:'#dc2626'},
  {id:'plis', name:'Jeux de plis', emoji:'♠️', color:'#78350f'},
  {id:'coop', name:'Coopératif', emoji:'🤝', color:'#14b8a6'},
  {id:'bluff', name:'Bluff / Déduction', emoji:'🎭', color:'#a855f7'},
  {id:'enquete', name:'Enquête / Narratif', emoji:'🔎', color:'#64748b'},
  {id:'gestion', name:'Gestion / Engine', emoji:'⚙️', color:'#f59e0b'},
  {id:'ouvriers', name:"Placement d'ouvriers", emoji:'👷', color:'#65a30d'},
  {id:'deck', name:'Deck-building / Draft', emoji:'📚', color:'#c026d3'},
  {id:'tuiles', name:'Tuiles / Puzzle', emoji:'🧩', color:'#0ea5e9'},
  {id:'des', name:'Dés / Hasard', emoji:'🎲', color:'#f97316'},
  {id:'rapidite', name:'Rapidité / Réflexes', emoji:'⚡', color:'#eab308'},
  {id:'mots', name:'Mots / Culture / Quiz', emoji:'🧠', color:'#0e7490'},
  {id:'duel', name:'Duel (2 joueurs)', emoji:'⚔️', color:'#1e293b'},
  {id:'abstrait', name:'Abstrait', emoji:'⚫', color:'#94a3b8'},
  {id:'conflit', name:'Conflit / Négociation', emoji:'🛡️', color:'#9f1239'},
];

const SEED_VERSION = 2;
/** Ajoute une seule fois les jeux par défaut (sans recréer un jeu déjà présent ou supprimé ensuite). */
function seedDefaults(){
  const v = S.settings.seedVersion || 0;
  if (v >= SEED_VERSION) return;
  if (v < 1) DEFAULT_GAMES.forEach((d, i) => {
    if (findSimilar(d.name, S.games).exact) return;
    S.games.push({id: uid(), createdAt: Date.now() + i, name: d.name, cats: d.cats, mode: d.mode, min: d.min, max: d.max, img: svgUri(GAME_ART[d.art]), notes: '', special: d.special || null});
  });
  if (v < 2) S.games.forEach(g => { if (norm(g.name) === 'tarot' && !g.special) g.special = 'tarot'; });
  S.settings.seedVersion = SEED_VERSION;
  save();
}

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const cleanName = s => String(s || '').replace(/\s+/g, ' ').trim();
function lev(a, b){
  if (a === b) return 0; if (!a.length) return b.length; if (!b.length) return a.length;
  let prev = Array.from({length:b.length+1}, (_, i) => i);
  for (let i = 1; i <= a.length; i++){
    const cur = [i];
    for (let j = 1; j <= b.length; j++) cur[j] = Math.min(prev[j]+1, cur[j-1]+1, prev[j-1] + (a[i-1] === b[j-1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}
function parseNum(s){
  if (s === null || s === undefined) return null;
  const t = String(s).replace(/\s/g, '').replace(',', '.');
  if (t === '' || t === '-') return null;
  const n = Number(t);
  return Number.isFinite(n) ? n : NaN;
}
const fmtNum = n => (n === null || n === undefined || Number.isNaN(n)) ? '–' : Number(n).toLocaleString('fr-FR', {maximumFractionDigits:2});
const pct = x => Number.isFinite(x) ? Math.round(x * 100) + ' %' : '–';
const plural = (n, s, p) => `${n} ${n > 1 ? (p || s + 's') : s}`;
function fmtDate(iso, opts){ return new Date(iso).toLocaleDateString('fr-FR', opts || {weekday:'short', day:'numeric', month:'short', year:'numeric'}); }
function fmtDateShort(iso){
  const d = new Date(iso), now = new Date();
  const sameYear = d.getFullYear() === now.getFullYear();
  const days = Math.floor((new Date(now.toDateString()) - new Date(d.toDateString())) / 864e5);

/** Recherche de doublons : exact (bloquant) ou proche (avertissement). */
function findSimilar(name, list, selfId){
  const n = norm(name); if (!n) return {};
  const others = list.filter(x => x.id !== selfId);
  const exact = others.find(x => norm(x.name) === n || norm(x.name).replace(/ /g,'') === n.replace(/ /g,''));
  if (exact) return {exact};
  const close = others.find(x => {
    const m = norm(x.name);
    if (n.length >= 4 && m.length >= 4 && (m.includes(n) || n.includes(m))) return true;
    const d = lev(n, m);
    return (Math.max(n.length, m.length) >= 5 && d <= 2) || (Math.max(n.length, m.length) >= 3 && d <= 1);
  });
  return close ? {close} : {};
}
/** Trouve une catégorie à partir d'un texte libre (pour l'ajout en masse). */
function findCat(text){
  const t = norm(text); if (!t) return null;
  const cats = allCats();
  let c = cats.find(c => c.id === t || norm(c.name) === t);
  if (c) return c;
  c = cats.find(c => norm(c.name).split(' ').includes(t) || norm(c.name).startsWith(t));
  if (c) return c;
  const syn = {'party':'ambiance', 'jeu de cartes':'cartes', 'carte':'cartes', 'cooperation':'coop', 'cooperatif':'coop', 'deduction':'bluff', 'engine':'gestion', 'worker placement':'ouvriers', 'draft':'deck', 'deckbuilding':'deck', 'puzzle':'tuiles', 'hasard':'des', 'de':'des', 'reflexe':'rapidite', 'rapide':'rapidite', 'quiz':'mots', 'culture':'mots', '2 joueurs':'duel', 'a deux':'duel', 'famille':'familial', 'negociation':'conflit', 'wargame':'conflit', 'narratif':'enquete', 'strategique':'strategie', 'tarot':'plis'};
  if (syn[t]) return C(syn[t]);
  c = cats.find(c => norm(c.name).split(' ').some(w => w.length > 3 && lev(w, t) <= 2));
  return c || null;
}
function findMode(text){
  const t = norm(text);
  if (!t) return null;
  if (['moins','low','plus bas','bas','moins de points','le moins'].includes(t)) return 'low';
  if (['plus','high','haut','plus haut','points','plus de points','le plus'].includes(t)) return 'high';
  if (['gagnant','gagnants','winner','victoire','sans points'].includes(t)) return 'winner';
  if (['equipe','equipes','team','teams','en equipe','en equipes'].includes(t)) return 'teams';
  if (['coop','cooperatif','cooperation'].includes(t)) return 'coop';
  return null;
}

/* ---------- Classement d'une partie ---------- */
function computeRanks(m){
  const R = m.results || [];
  if (m.mode === 'high' || m.mode === 'low'){
    R.forEach(r => { r.rank = 1 + R.filter(o => m.mode === 'high' ? o.score > r.score : o.score < r.score).length; });
  } else if (m.mode === 'winner'){
    const nw = R.filter(r => r.win).length;
    R.forEach(r => r.rank = r.win ? 1 : nw + 1);
  } else if (m.mode === 'teams'){
    const used = [...new Set(R.map(r => r.team))];
    const ts = m.teamScores || {};
    const allNum = used.every(t => typeof ts[t] === 'number');
    const teamRank = {};
    used.forEach(t => {
      if (allNum) teamRank[t] = 1 + used.filter(o => ts[o] > ts[t]).length;
      else teamRank[t] = (t === m.winTeam) ? 1 : 2;
    });
    R.forEach(r => r.rank = teamRank[r.team] || 2);
  } else if (m.mode === 'coop'){
    R.forEach(r => r.rank = m.coopWin ? 1 : 2);
  }
  return m;
}

/* ---------- Moteur de statistiques ---------- */
/** Résultat d'un joueur dans une partie : victoire, perf (0→1), chance de gagner au hasard. */
function line(m, pid){
  const me = m.results.find(r => r.pid === pid);
  if (!me) return null;
  if (m.mode === 'coop') return {coop:true, win:!!m.coopWin};
  const others = m.results.filter(r => r.pid !== pid && !(m.mode === 'teams' && r.team === me.team));
  const behind = others.filter(o => o.rank > me.rank).length;
  const tied = others.filter(o => o.rank === me.rank).length;
  const perf = others.length ? (behind + 0.5 * tied) / others.length : 1;
  const sides = m.mode === 'teams' ? new Set(m.results.map(r => r.team)).size : m.results.length;
  return {win: me.rank === 1, rank: me.rank, perf, exp: 1 / Math.max(sides, 1), n: m.results.length};
}
function aggregate(matches){
  const map = new Map();
  const get = pid => { if (!map.has(pid)) map.set(pid, {pid, played:0, wins:0, perf:0, exp:0, coop:0, coopWins:0, winsByCat:{}, games:{}}); return map.get(pid); };
  for (const m of matches){
    const g = G(m.gameId);
    for (const r of m.results){
      const l = line(m, r.pid), a = get(r.pid);
      if (l.coop){ a.coop++; if (l.win) a.coopWins++; continue; }
      a.played++; a.perf += l.perf; a.exp += l.exp;
      const gg = a.games[m.gameId] || (a.games[m.gameId] = {played:0, wins:0});
      gg.played++;
      if (l.win){ a.wins++; gg.wins++; const c = (g && g.cats[0]) || '?'; a.winsByCat[c] = (a.winsByCat[c] || 0) + 1; }
    }
  }
  for (const a of map.values()){
    a.rate = a.played ? a.wins / a.played : NaN;
    a.perfAvg = a.played ? a.perf / a.played : NaN;
    a.index = a.exp ? a.wins / a.exp : NaN;
  }
  return map;
}
function streaks(pid, matches){
  const ms = matches.filter(m => m.mode !== 'coop' && m.results.some(r => r.pid === pid)).sort((a, b) => a.date.localeCompare(b.date));
  let cur = 0, best = 0;
  for (const m of ms){ if (line(m, pid).win){ cur++; best = Math.max(best, cur); } else cur = 0; }
  return {cur, best, form: ms.slice(-10).map(m => line(m, pid).win)};
}
function h2h(a, b, matches){
  const res = {n:0, a:0, b:0, tie:0, together:0, togetherWins:0, byGame:{}};
  for (const m of matches){
    if (m.mode === 'coop') continue;
    const ra = m.results.find(r => r.pid === a), rb = m.results.find(r => r.pid === b);
    if (!ra || !rb) continue;
    if (m.mode === 'teams' && ra.team === rb.team){ res.together++; if (ra.rank === 1) res.togetherWins++; continue; }
    const bg = res.byGame[m.gameId] || (res.byGame[m.gameId] = {n:0, a:0, b:0, tie:0});
    res.n++; bg.n++;
    if (ra.rank < rb.rank){ res.a++; bg.a++; } else if (rb.rank < ra.rank){ res.b++; bg.b++; } else { res.tie++; bg.tie++; }
  }
  return res;
}
function groupStats(ids, matches, exact){
  const set = new Set(ids);
  const ms = matches.filter(m => m.mode !== 'coop' && ids.every(id => m.results.some(r => r.pid === id)) && (!exact || m.results.length === ids.length));
  const rows = ids.map(pid => ({pid, played:ms.length, wins:0, best:0, perf:0}));
  const byGame = {};
  for (const m of ms){
    const rs = m.results.filter(r => set.has(r.pid));
    const min = Math.min(...rs.map(r => r.rank));
    const top = rs.filter(r => r.rank === min);
    const bg = byGame[m.gameId] || (byGame[m.gameId] = {n:0, best:{}});
    bg.n++;
    for (const row of rows){
      const r = rs.find(x => x.pid === row.pid);
      if (r.rank === 1) row.wins++;
      if (r.rank === min){ row.best += 1 / top.length; bg.best[row.pid] = (bg.best[row.pid] || 0) + 1 / top.length; }
      row.perf += line(m, row.pid).perf;
    }
  }
  const coopMs = matches.filter(m => m.mode === 'coop' && ids.every(id => m.results.some(r => r.pid === id)) && (!exact || m.results.length === ids.length));
  return {ms, rows, byGame, coopN: coopMs.length, coopW: coopMs.filter(m => m.coopWin).length};
}
function duoStats(matches){
  const map = {};
  for (const m of matches){
    if (m.mode !== 'teams') continue;
    const teams = {};
    m.results.forEach(r => (teams[r.team] = teams[r.team] || []).push(r));
    for (const t of Object.values(teams)){
      for (let i = 0; i < t.length; i++) for (let j = i + 1; j < t.length; j++){
        const ids = [t[i].pid, t[j].pid].sort(); const k = ids.join('|');
        const d = map[k] || (map[k] = {a:ids[0], b:ids[1], n:0, w:0});
        d.n++; if (t[0].rank === 1) d.w++;
      }
    }
  }
  return Object.values(map).sort((x, y) => (y.w / y.n) - (x.w / x.n) || y.n - x.n);
}

    h += `<div class="banner"><div class="grow">✏️ ${draft.editId ? 'Modification de partie' : 'Partie'} en cours de saisie${draft.gameId && G(draft.gameId) ? ' : <b>' + esc(G(draft.gameId).name) + '</b>' : ''}</div><button class="btn small primary" data-act="go" data-to="${draft.editId ? '#/edit/' + draft.editId : '#/new'}">Reprendre</button><button class="btn small" data-act="discard-draft">✕</button></div>`;
  const unsaved = S.matches.length - (S.settings.matchesAtBackup || 0);
  const ghc = ghCfg();
  if (ghReady(ghc) && ghc.lastErr && (!ghc.lastOk || ghc.lastErr.at > ghc.lastOk) && ghIsDirty())
    h += `<div class="banner warn"><div class="grow">☁️ La sauvegarde GitHub n’a pas pu être envoyée : ${esc(ghc.lastErr.msg)}</div><button class="btn small" data-act="gh-push">Réessayer</button></div>`;
  else if (S.matches.some(m => !m.demo) && (unsaved !== 0) && Math.min(daysSince(S.settings.lastBackup), ghReady(ghc) ? daysSince(ghc.lastOk) : Infinity) >= 7)
    h += `<div class="banner warn"><div class="grow">💾 ${S.settings.lastBackup ? 'Dernière sauvegarde il y a ' + Math.floor(daysSince(S.settings.lastBackup)) + ' j' : 'Aucune sauvegarde pour l’instant'}. Pense à sauvegarder tes ${plural(S.matches.length, 'partie')} !</div><button class="btn small" data-act="export">Sauvegarder</button></div>`;
  S.tarot.forEach(t => { h += `<div class="banner"><div class="grow">🃏 <b>Tarot en cours</b> · ${plural(t.rounds.length, 'manche')}<div class="small muted ell">${t.pids.map(pname).map(esc).join(', ')}</div></div><button class="btn small primary" data-act="go" data-to="#/tarot/${t.id}">Reprendre</button></div>`; });
  if (installPrompt) h += `<div class="banner"><div class="grow">📲 Installe Ludiscore sur ton écran d’accueil.</div><button class="btn small primary" data-act="install">Installer</button></div>`;

  if (!S.games.length || !S.players.length){
    h += `<div class="card"><h2>Pour démarrer</h2>
      <div class="list">
        <button class="item" data-act="add-game"><span class="gi" style="background:var(--primary-soft)">${S.games.length ? '✅' : '🎲'}</span><div class="grow"><div class="t">1. Ajoute tes jeux</div><div class="s">${S.games.length ? plural(S.games.length, 'jeu', 'jeux') + ' enregistrés' : 'Nom + 1 ou 2 catégories'}</div></div><span class="chev">›</span></button>
        <button class="item" data-act="add-player"><span class="gi" style="background:var(--primary-soft)">${S.players.length ? '✅' : '👥'}</span><div class="grow"><div class="t">2. Ajoute les joueurs</div><div class="s">${S.players.length ? plural(S.players.length, 'joueur') + ' enregistrés' : 'Toi et tes amis'}</div></div><span class="chev">›</span></button>
        <button class="item" data-act="new-match"><span class="gi" style="background:var(--primary-soft)">🏁</span><div class="grow"><div class="t">3. Enregistre une partie</div><div class="s">Jeu → joueurs → points</div></div><span class="chev">›</span></button>
      </div></div>`;
  }
  if (ms.length){
    const last = ms[0], lg = G(last.gameId);
    if (lg && !lg.archived)
      h += `<button class="item" style="margin-top:12px" data-act="replay" data-id="${last.id}">${gameIcon(lg, 44)}<div class="grow"><div class="t">🔁 Rejouer : ${esc(lg.name)}</div><div class="s ell">Mêmes joueurs : ${last.results.map(r => esc(pname(r.pid))).join(', ')}</div></div><span class="chev">›</span></button>`;
    const now = new Date();
    const month = S.matches.filter(m => { const d = new Date(m.date); return d.getMonth() === now.getMonth() && d.getFullYear() === now.getFullYear(); }).length;
    h += `<div class="tiles" style="margin-top:12px">
      <div class="tile"><div class="v">${S.matches.length}</div><div class="l">parties jouées</div></div>
      <div class="tile"><div class="v">${month}</div><div class="l">ce mois-ci</div></div>
      <div class="tile"><div class="v">${new Set(S.matches.map(m => m.gameId)).size}</div><div class="l">jeux différents joués</div></div>
      <div class="tile"><div class="v">${activePlayers().length}</div><div class="l">joueurs</div></div></div>`;
    // Top joueurs de l'année
    const y = now.getFullYear();
    const yearMs = S.matches.filter(m => new Date(m.date).getFullYear() === y);
    const agg = [...aggregate(yearMs).values()].filter(a => a.played >= Math.min(S.settings.minGames, 3) && P(a.pid) && !P(a.pid).archived).sort((a, b) => b.rate - a.rate || b.wins - a.wins).slice(0, 3);
    if (agg.length){
      h += `<div class="sec">🏆 Podium ${y}</div><div class="lb">${agg.map((a, i) => `<button class="lbrow" data-act="go" data-to="#/player/${a.pid}"><div class="pos">${medal(i + 1)}</div><div class="row grow">${avatar(P(a.pid), 34)}<div class="grow"><div class="b ell">${esc(pname(a.pid))}</div><div class="sub">${a.wins} victoires / ${a.played} parties</div></div></div><div class="big">${pct(a.rate)}</div></button>`).join('')}</div>`;
    }
    // Jeux les plus joués
    const gc = gameCounts();
    const topG = Object.entries(gc).sort((a, b) => b[1] - a[1]).slice(0, 5).filter(([id]) => G(id));
    if (topG.length) h += `<div class="sec">🎲 Jeux les plus joués</div><div class="list">${topG.map(([id, n]) => `<button class="item" data-act="go" data-to="#/game/${id}">${gameIcon(G(id), 36)}<div class="grow"><div class="t ell">${esc(G(id).name)}</div></div><div class="b">${n}</div><span class="chev">›</span></button>`).join('')}</div>`;
    h += `<div class="sec">🕑 Dernières parties</div><div class="list">${ms.slice(0, 5).map(matchCard).join('')}</div>
      <div class="btns"><button class="btn" data-act="go" data-to="#/matches">Voir tout l’historique</button></div>`;
  }
  return h;
};

/* ---------- Carte d'une partie ---------- */
function scoreSuffix(m, r){
  if (m.mode === 'high' || m.mode === 'low') return ` · ${fmtNum(r.score)}`;
  return '';
}
function matchPills(m){
  const rs = [...m.results].sort((a, b) => a.rank - b.rank);
  if (m.mode === 'coop')
    return `<span class="pill ${m.coopWin ? 'win' : 'lose'}">${m.coopWin ? '🎉 Victoire' : '💀 Défaite'}${typeof m.coopScore === 'number' ? ' · ' + fmtNum(m.coopScore) : ''}</span>` + rs.map(r => `<span class="pill">${esc(pname(r.pid))}</span>`).join('');
  if (m.mode === 'teams'){
    const teams = [...new Set(rs.map(r => r.team))];
    return teams.map(t => { const mem = rs.filter(r => r.team === t); const win = mem[0].rank === 1; const sc = m.teamScores && typeof m.teamScores[t] === 'number' ? ' · ' + fmtNum(m.teamScores[t]) : '';
      return `<span class="pill ${win ? 'win' : ''}">${win ? '👑 ' : ''}${mem.map(r => esc(pname(r.pid))).join(' + ')}${sc}</span>`; }).join('');
  }
  return rs.map(r => `<span class="pill ${r.rank === 1 ? 'win' : ''}">${r.rank === 1 ? '👑 ' : ''}${esc(pname(r.pid))}${scoreSuffix(m, r)}</span>`).join('');
}
function matchCard(m){
  const g = G(m.gameId);
  return `<button class="match" data-act="open-match" data-id="${m.id}">${gameIcon(g, 40)}<div class="mbody"><div class="mtitle"><b class="ell">${esc(g ? g.name : 'Jeu supprimé')}</b><span class="muted small" style="flex:none">${fmtDateShort(m.date)}</span></div><div class="pills">${matchPills(m)}</div></div></button>`;
}

/* ---------- Historique des parties ---------- */
VIEWS.matches = () => {
  if (!S.matches.length) return emptyBox('📜', 'Aucune partie enregistrée pour l’instant.', `<button class="btn primary" data-act="new-match">＋ Enregistrer une partie</button>`);
  let ms = sortedMatches();
  if (UI.mGame) ms = ms.filter(m => m.gameId === UI.mGame);
  if (UI.mPlayer) ms = ms.filter(m => m.results.some(r => r.pid === UI.mPlayer));
  const gOpts = [...S.games].sort(byName).map(g => `<option value="${g.id}" ${UI.mGame === g.id ? 'selected' : ''}>${esc(g.name)}</option>`).join('');
  const pOpts = [...S.players].sort(byName).map(p => `<option value="${p.id}" ${UI.mPlayer === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  let h = `<div class="two"><select id="mfGame"><option value="">Tous les jeux</option>${gOpts}</select><select id="mfPlayer"><option value="">Tous les joueurs</option>${pOpts}</select></div>
    <div class="small muted" style="margin:8px 2px">${plural(ms.length, 'partie')}${UI.mGame || UI.mPlayer ? ' · <a href="#" data-act="clear-mfilters">effacer les filtres</a>' : ''}</div>`;
  let curMonth = '';
  const shown = ms.slice(0, 300);
  for (const m of shown){
    const mk = fmtDate(m.date, {month:'long', year:'numeric'});
    if (mk !== curMonth){ if (curMonth) h += '</div>'; h += `<div class="month">${mk}</div><div class="list">`; curMonth = mk; }
    h += matchCard(m);
  }
  if (curMonth) h += '</div>';
  if (ms.length > shown.length) h += `<p class="small muted center">… et ${ms.length - shown.length} parties plus anciennes (utilise les filtres).</p>`;
  return {html: h, mount: v => {
    $('#mfGame', v).onchange = e => { UI.mGame = e.target.value; saveUI(); render(); };
    $('#mfPlayer', v).onchange = e => { UI.mPlayer = e.target.value; saveUI(); render(); };
  }};
};

/* ---------- Détail d'une partie (feuille) ---------- */
function openMatch(id){
  const m = S.matches.find(x => x.id === id); if (!m) return;
  const g = G(m.gameId);
  const rs = [...m.results].sort((a, b) => a.rank - b.rank || pname(a.pid).localeCompare(pname(b.pid)));
  let rows = '';
  if (m.mode === 'coop'){
    rows = `<div class="banner ${m.coopWin ? '' : 'warn'}" style="justify-content:center;font-size:18px;font-weight:800">${m.coopWin ? '🎉 Victoire collective' : '💀 Défaite collective'}${typeof m.coopScore === 'number' ? ' · ' + fmtNum(m.coopScore) + ' pts' : ''}</div>` + rs.map(r => `<div class="prow">${avatar(P(r.pid), 28)} ${esc(pname(r.pid))}</div>`).join('');
  } else {
    rows = rs.map(r => `<div class="prow"><span class="rk">${medal(r.rank)}</span>${avatar(P(r.pid), 28)}<span class="grow b">${esc(pname(r.pid))}</span>${m.mode === 'teams' ? `<span class="badge" style="--c:${TEAM_COLORS[r.team]}">Équipe ${r.team}${m.teamScores && typeof m.teamScores[r.team] === 'number' ? ' · ' + fmtNum(m.teamScores[r.team]) : ''}</span>` : ''}${m.mode === 'high' || m.mode === 'low' ? `<span class="b">${fmtNum(r.score)}</span>` : ''}</div>`).join('');
  }
  openSheet(`<div class="hero">${gameIcon(g, 56)}<div><h2>${esc(g ? g.name : 'Jeu supprimé')}</h2><div class="muted small">${fmtDate(m.date, {weekday:'long', day:'numeric', month:'long', year:'numeric'})} · ${new Date(m.date).toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})}${m.duration ? ' · ⏱ ' + m.duration + ' min' : ''}</div></div></div>
    <div class="card"><div class="preview">${rows}</div>${m.notes ? `<p class="small" style="margin:12px 0 0">📝 ${esc(m.notes)}</p>` : ''}${m.tarot ? `<div class="btns"><button class="btn small" data-act="tarot-rounds" data-id="${m.id}">🃏 Voir le détail des manches</button></div>` : ''}</div>
    <div class="btns">
      ${m.tarot ? `<button class="btn" data-act="tarot-reopen" data-id="${m.id}">↩️ Rouvrir</button>` : `<button class="btn" data-act="edit-match" data-id="${m.id}">✏️ Modifier</button>`}
      <button class="btn" data-act="replay" data-id="${m.id}">🔁 Rejouer</button>
      <button class="btn" data-act="share-match" data-id="${m.id}">📤 Partager</button>
    </div>
    <div class="btns"><button class="btn outline-danger" data-act="delete-match" data-id="${m.id}">🗑 Supprimer cette partie</button></div>
    <div class="btns"><button class="btn ghost" data-act="close-sheet">Fermer</button></div>`);
}
function matchText(m){
  const g = G(m.gameId);
  const rs = [...m.results].sort((a, b) => a.rank - b.rank);
  let t = `🎲 ${g ? g.name : 'Partie'} — ${fmtDate(m.date)}\n`;
  if (m.mode === 'coop') t += (m.coopWin ? '🎉 Victoire' : '💀 Défaite') + ' : ' + rs.map(r => pname(r.pid)).join(', ');
  else t += rs.map(r => `${medal(r.rank)} ${pname(r.pid)}${m.mode === 'teams' ? ' (équipe ' + r.team + ')' : ''}${m.mode === 'high' || m.mode === 'low' ? ' : ' + fmtNum(r.score) : ''}`).join('\n');
  return t + '\n— via Ludiscore';
}

/* ---------- Statistiques ---------- */
VIEWS.stats = () => {
  const comp = S.matches.filter(m => m.mode !== 'coop');
  if (!S.matches.length) return emptyBox('📊', 'Les statistiques apparaîtront après ta première partie.', `<button class="btn primary" data-act="new-match">＋ Enregistrer une partie</button>`);
  const tabs = [['board', '🏆 Classement'], ['group', '👥 Groupe'], ['h2h', '⚔️ Face-à-face'], ['games', '🎲 Par jeu'], ['cats', '🏷 Par catégorie']];
  const usedCats = [...new Set(S.matches.flatMap(m => (G(m.gameId) || {cats:[]}).cats))];
  const playedGames = [...new Set(S.matches.map(m => m.gameId))].map(G).filter(Boolean).sort(byName);
  let h = `<div class="seg">${tabs.map(([k, l]) => `<button class="${UI.tab === k ? 'on' : ''}" data-act="stats-tab" data-tab="${k}">${l}</button>`).join('')}</div>
   <div class="card" style="padding:10px 12px;margin-top:6px">
    <div class="two">
      <select id="fPeriod"><option value="all">📅 Depuis toujours</option><option value="year">Cette année</option><option value="12m">12 derniers mois</option><option value="30d">30 derniers jours</option></select>
      <select id="fCat"><option value="">🏷 Toutes catégories</option>${usedCats.map(c => `<option value="${c}">${C(c).emoji} ${esc(C(c).name)}</option>`).join('')}</select>
    </div>
    <select id="fGame" style="margin-top:8px"><option value="">🎲 Tous les jeux</option>${playedGames.map(g => `<option value="${g.id}">${esc(g.name)}</option>`).join('')}</select>
    ${filterLabel() ? `<div class="small" style="margin-top:6px">Filtre actif : <b>${esc(filterLabel())}</b> · <a href="#" data-act="clear-filters">effacer</a></div>` : ''}
   </div>`;
  const ms = applyFilters(S.matches);
  if (!ms.length) h += emptyBox('🔍', 'Aucune partie ne correspond à ces filtres.');
  else h += ({board: statsBoard, group: statsGroup, h2h: statsH2H, games: statsGames, cats: statsCats}[UI.tab] || statsBoard)(ms);
  return {html: h, mount: v => {
    $('#fPeriod', v).value = UI.period; $('#fCat', v).value = UI.cat; $('#fGame', v).value = UI.game;
    $('#fPeriod', v).onchange = e => { UI.period = e.target.value; saveUI(); render(); };
    $('#fCat', v).onchange = e => { UI.cat = e.target.value; saveUI(); render(); };
    $('#fGame', v).onchange = e => { UI.game = e.target.value; saveUI(); render(); };
    const ms2 = $('#gExact', v); if (ms2) ms2.onchange = e => { UI.exact = e.target.checked; saveUI(); render(); };
    const sa = $('#hA', v), sb = $('#hB', v);
    if (sa) sa.onchange = e => { UI.a = e.target.value; saveUI(); render(); };
    if (sb) sb.onchange = e => { UI.b = e.target.value; saveUI(); render(); };
  }};
};
function legendFor(aggs){
  const cats = new Set(); aggs.forEach(a => Object.keys(a.winsByCat).forEach(c => cats.add(c)));
  if (!cats.size) return '';
  return `<div class="legend">${[...cats].map(c => `<span><i style="background:${C(c).color}"></i>${esc(C(c).name)}</span>`).join('')}</div>`;
}
function statsBoard(ms){
  const min = S.settings.minGames;
  const all = [...aggregate(ms).values()].filter(a => a.played > 0 && P(a.pid) && !P(a.pid).archived);
  const keyF = {rate: a => a.rate, wins: a => a.wins, perf: a => a.perfAvg, index: a => a.index, played: a => a.played}[UI.sort] || (a => a.rate);
  const sorter = (a, b) => keyF(b) - keyF(a) || b.wins - a.wins || b.played - a.played;
  const ok = all.filter(a => a.played >= min || UI.showAll).sort(sorter);
  const low = all.filter(a => a.played < min && !UI.showAll);
  const sortNames = {rate:'% de victoires', wins:'Nb de victoires', perf:'Performance', index:'Indice vs hasard', played:'Parties jouées'};
  const val = a => UI.sort === 'wins' ? a.wins : UI.sort === 'perf' ? pct(a.perfAvg) : UI.sort === 'index' ? '×' + fmtNum(Math.round(a.index * 100) / 100) : UI.sort === 'played' ? a.played : pct(a.rate);
  let h = `<div class="row" style="margin:12px 2px 8px"><span class="small muted grow">Trier par</span><select id="lbSort" style="width:auto;padding:7px 10px">${Object.entries(sortNames).map(([k, l]) => `<option value="${k}" ${UI.sort === k ? 'selected' : ''}>${l}</option>`).join('')}</select></div>`;
  if (!ok.length) h += emptyBox('⏳', `Personne n’a encore ${min} parties sur cette sélection.`, `<button class="btn" data-act="toggle-showall">Afficher tout le monde</button>`);
  h += `<div class="lb">${ok.map((a, i) => `<button class="lbrow" data-act="go" data-to="#/player/${a.pid}">
      <div class="pos">${i < 3 ? medal(i + 1) : i + 1}</div>
      <div class="grow" style="min-width:0"><div class="row">${avatar(P(a.pid), 30)}<div class="grow" style="min-width:0"><div class="b ell">${esc(pname(a.pid))}</div><div class="sub">${a.wins} V / ${a.played} P · perf ${pct(a.perfAvg)} · ×${fmtNum(Math.round(a.index * 100) / 100)}</div></div></div>${winBar(a)}</div>
      <div class="big">${val(a)}</div></button>`).join('')}</div>`;
  h += legendFor(ok);
  if (low.length) h += `<p class="small muted" style="margin-top:12px">Pas assez de parties (moins de ${min}) : ${low.map(a => esc(pname(a.pid)) + ' (' + a.played + ')').join(', ')}. <a href="#" data-act="toggle-showall">Les inclure</a></p>`;
  else if (UI.showAll) h += `<p class="small muted" style="margin-top:12px"><a href="#" data-act="toggle-showall">Masquer ceux qui ont moins de ${min} parties</a></p>`;
  const coop = ms.filter(m => m.mode === 'coop');
  if (coop.length) h += `<div class="card"><h2>🤝 Jeux coopératifs</h2><div class="small">${plural(coop.length, 'partie')} · taux de réussite collectif <b>${pct(coop.filter(m => m.coopWin).length / coop.length)}</b> (non compté dans le classement ci-dessus).</div></div>`;
  h += `<details class="card small"><summary class="b">ℹ️ Comment lire ces chiffres ?</summary>
    <p><b>% de victoires</b> : parties gagnées / parties jouées (les égalités à la 1ʳᵉ place comptent comme des victoires). La barre est colorée selon la catégorie principale des jeux gagnés.</p>
    <p><b>Performance</b> : en moyenne, la part des adversaires que tu as battus (100 % = toujours 1ᵉʳ, 0 % = toujours dernier). Plus juste que le % de victoires quand on joue à beaucoup.</p>
    <p><b>Indice vs hasard</b> : victoires / victoires attendues si tout le monde avait le même niveau (gagner 1 partie à 4 « vaut » plus qu’1 partie à 2). ×1 = moyenne, ×2 = deux fois plus que le hasard.</p></details>`;
  return h;
}
function statsGroup(ms){
  const ids = UI.group.filter(id => P(id));
  const pc = playCounts();
  const pl = activePlayers().sort((a, b) => (pc[b.id] || 0) - (pc[a.id] || 0) || byName(a, b));
  let h = `<div class="card"><h2>Choisis un groupe de joueurs</h2>
    ${S.groups.length ? `<div class="chips" style="margin-bottom:8px">${S.groups.map(gr => `<button class="chip noav" data-act="stats-group-preset" data-id="${gr.id}">📁 ${esc(gr.name)}</button>`).join('')}</div>` : ''}
    <div class="chips">${pl.map(p => `<button class="chip ${ids.includes(p.id) ? 'on' : ''}" data-act="stats-group-toggle" data-id="${p.id}">${avatar(p, 24)}${esc(p.name)}</button>`).join('')}</div>
    <label class="row small" style="margin-top:12px;gap:10px;align-items:flex-start"><input type="checkbox" id="gExact" ${UI.exact ? 'checked' : ''} style="width:20px;height:20px;flex:none;accent-color:var(--primary)"><span>Uniquement les parties où ils étaient <b>exactement</b> ce groupe (personne d’autre)</span></label>
    ${ids.length ? `<div class="btns"><button class="btn small" data-act="stats-group-clear">Vider la sélection</button>${ids.length >= 2 ? `<button class="btn small" data-act="save-group-from-stats">💾 Enregistrer ce groupe</button>` : ''}</div>` : ''}</div>`;
  if (ids.length < 2) return h + `<p class="muted small center">Sélectionne au moins 2 joueurs pour voir qui gagne le plus quand ils jouent ensemble.</p>`;
  const gs = groupStats(ids, ms, UI.exact);
  if (!gs.ms.length) return h + emptyBox('🤷', `Aucune partie compétitive avec ${UI.exact ? 'exactement' : 'au moins'} ces joueurs${filterLabel() ? ' (avec les filtres actuels)' : ''}.`);
  const rows = [...gs.rows].sort((a, b) => b.best - a.best || b.wins - a.wins);
  h += `<div class="card"><h2>${plural(gs.ms.length, 'partie')} ensemble</h2>
    <div class="tblwrap"><table class="tbl"><tr><th>Joueur</th><th>Meilleur du groupe</th><th>Victoires</th><th>Perf</th></tr>
    ${rows.map((r, i) => `<tr class="click" data-act="go" data-to="#/player/${r.pid}"><td><div class="row">${i === 0 ? '👑' : ''}${avatar(P(r.pid), 24)}<span class="b">${esc(pname(r.pid))}</span></div></td><td><b>${fmtNum(Math.round(r.best * 10) / 10)}</b> <span class="muted">(${pct(r.best / r.played)})</span></td><td>${r.wins} <span class="muted">(${pct(r.wins / r.played)})</span></td><td>${pct(r.perf / r.played)}</td></tr>`).join('')}
    </table></div>
    <p class="small muted" style="margin:10px 0 0">« Meilleur du groupe » = nombre de fois où le joueur a fini devant les autres membres du groupe (même si un joueur extérieur a gagné). Égalité = point partagé.</p></div>`;
  const games = Object.entries(gs.byGame).sort((a, b) => b[1].n - a[1].n);
  h += `<div class="card"><h2>Qui domine sur chaque jeu ?</h2><div class="tblwrap"><table class="tbl"><tr><th>Jeu</th><th>Parties</th><th>Le plus fort</th></tr>
    ${games.map(([gid, d]) => { const best = Object.entries(d.best).sort((a, b) => b[1] - a[1]); const top = best[0]; const tie = best[1] && best[1][1] === top[1];
      return `<tr class="click" data-act="go" data-to="#/game/${gid}"><td class="ell" style="max-width:150px">${esc((G(gid) || {name:'?'}).name)}</td><td>${d.n}</td><td>${tie ? '<span class="muted">égalité</span>' : esc(pname(top[0])) + ` <span class="muted">(${fmtNum(Math.round(top[1] * 10) / 10)})</span>`}</td></tr>`; }).join('')}
    </table></div></div>`;
  if (gs.coopN) h += `<div class="card"><h2>🤝 En coopératif</h2><div class="small">${plural(gs.coopN, 'partie')} ensemble · ${gs.coopW} victoires (${pct(gs.coopW / gs.coopN)})</div></div>`;
  return h;
}
function statsH2H(ms){
  const pc = playCounts();
  const pl = activePlayers().sort((a, b) => (pc[b.id] || 0) - (pc[a.id] || 0) || byName(a, b));
  if (pl.length < 2) return emptyBox('⚔️', 'Il faut au moins 2 joueurs.');
  if (!P(UI.a)) UI.a = pl[0].id;
  if (!P(UI.b) || UI.b === UI.a) UI.b = (pl.find(p => p.id !== UI.a) || pl[1]).id;
  const opt = sel => pl.map(p => `<option value="${p.id}" ${sel === p.id ? 'selected' : ''}>${esc(p.name)}</option>`).join('');
  const r = h2h(UI.a, UI.b, ms);
  let h = `<div class="card"><div class="two"><select id="hA">${opt(UI.a)}</select><select id="hB">${opt(UI.b)}</select></div>`;
  if (!r.n && !r.together) h += `<p class="muted center small">Ces deux joueurs n’ont jamais joué ensemble${filterLabel() ? ' avec ces filtres' : ''}.</p></div>`;
  else {
    h += `<div class="h2h" style="margin-top:14px"><div>${avatar(P(UI.a), 48)}<div class="b">${esc(pname(UI.a))}</div></div><div><span class="sc">${r.a} – ${r.b}</span><div class="small muted">${plural(r.n, 'partie')} l’un contre l’autre${r.tie ? ' · ' + plural(r.tie, 'égalité') : ''}</div></div><div>${avatar(P(UI.b), 48)}<div class="b">${esc(pname(UI.b))}</div></div></div>
     ${r.n ? `<div class="bar" style="height:12px;margin-top:12px"><span style="width:${r.a / r.n * 100}%;background:${P(UI.a).color}"></span><span style="width:${r.tie / r.n * 100}%;background:var(--muted)"></span><span style="width:${r.b / r.n * 100}%;background:${P(UI.b).color}"></span></div>` : ''}
     <p class="small muted" style="margin:10px 0 0">Score = nombre de parties où l’un a fini devant l’autre (peu importe qui a gagné la partie).</p>
     ${r.together ? `<p class="small" style="margin:8px 0 0">👥 Dans la même équipe : ${plural(r.together, 'partie')}, ${r.togetherWins} victoires (${pct(r.togetherWins / r.together)}).</p>` : ''}</div>`;
    const bg = Object.entries(r.byGame).sort((a, b) => b[1].n - a[1].n);
    if (bg.length) h += `<div class="card"><h2>Par jeu</h2><div class="tblwrap"><table class="tbl"><tr><th>Jeu</th><th>${esc(pname(UI.a))}</th><th>${esc(pname(UI.b))}</th><th>Nul</th></tr>${bg.map(([gid, d]) => `<tr><td class="ell" style="max-width:140px">${esc((G(gid) || {name:'?'}).name)}</td><td class="${d.a > d.b ? 'b' : ''}">${d.a}</td><td class="${d.b > d.a ? 'b' : ''}">${d.b}</td><td>${d.tie}</td></tr>`).join('')}</table></div></div>`;
  }
  // Matrice
  const counts = {}; ms.filter(m => m.mode !== 'coop').forEach(m => m.results.forEach(x => counts[x.pid] = (counts[x.pid] || 0) + 1));
  const mx = pl.filter(p => counts[p.id]).sort((a, b) => counts[b.id] - counts[a.id]).slice(0, 7);
  if (mx.length >= 3){
    h += `<div class="card"><h2>Qui bat qui ?</h2><div class="tblwrap"><table class="tbl mx"><tr><th></th>${mx.map(p => `<th>${avatar(p, 24)}</th>`).join('')}</tr>
      ${mx.map(p => `<tr><th>${avatar(p, 24)}</th>${mx.map(q => { if (p.id === q.id) return '<td class="muted">·</td>'; const d = h2h(p.id, q.id, ms); if (!d.n) return '<td class="muted">–</td>'; const v = (d.a + .5 * d.tie) / d.n; const col = v >= .5 ? `color-mix(in srgb,var(--ok) ${Math.round((v - .5) * 160)}%,transparent)` : `color-mix(in srgb,var(--danger) ${Math.round((.5 - v) * 160)}%,transparent)`; return `<td class="c" style="background:${col}" title="${d.a}-${d.b}">${Math.round(v * 100)}</td>`; }).join('')}</tr>`).join('')}
      </table></div><p class="small muted" style="margin:8px 0 0">Ligne contre colonne : % de fois où le joueur de la ligne a fini devant celui de la colonne. Vert = il domine, rouge = il subit.</p></div>`;
  }
  const duos = duoStats(ms).filter(d => P(d.a) && P(d.b));
  if (duos.length) h += `<div class="card"><h2>👥 Meilleurs duos (jeux en équipe)</h2><div class="tblwrap"><table class="tbl"><tr><th>Duo</th><th>Parties</th><th>Victoires</th></tr>${duos.slice(0, 10).map(d => `<tr><td>${esc(pname(d.a))} + ${esc(pname(d.b))}</td><td>${d.n}</td><td><b>${pct(d.w / d.n)}</b> (${d.w})</td></tr>`).join('')}</table></div></div>`;
  return h;
}
function statsGames(ms){
  const by = {};
  ms.forEach(m => (by[m.gameId] = by[m.gameId] || []).push(m));
  const rows = Object.entries(by).filter(([gid]) => G(gid)).sort((a, b) => b[1].length - a[1].length);
  return `<div class="list" style="margin-top:12px">${rows.map(([gid, list]) => {
    const g = G(gid);
    let champ = '';
    if (g.mode === 'coop') champ = `Réussite collective ${pct(list.filter(m => m.coopWin).length / list.length)}`;
    else { const ag = [...aggregate(list).values()].filter(a => a.played >= Math.min(2, list.length) && P(a.pid)).sort((a, b) => b.rate - a.rate || b.wins - a.wins); champ = ag[0] ? `👑 ${esc(pname(ag[0].pid))} · ${pct(ag[0].rate)} (${ag[0].wins}/${ag[0].played})` : ''; }
    return `<button class="item" data-act="go" data-to="#/game/${gid}">${gameIcon(g, 40)}<div class="grow" style="min-width:0"><div class="t ell">${esc(g.name)}</div><div class="s ell">${champ}</div></div><div class="b">${list.length}</div><span class="chev">›</span></button>`;
  }).join('')}</div><p class="small muted">Le champion est le joueur avec le meilleur % de victoires sur le jeu (2 parties minimum). Touche un jeu pour le détail.</p>`;
}
function statsCats(ms){
  const by = {};
  ms.forEach(m => { const g = G(m.gameId); if (g) g.cats.forEach(c => (by[c] = by[c] || []).push(m)); });
  const rows = Object.entries(by).sort((a, b) => b[1].length - a[1].length);
  return `<div class="list" style="margin-top:12px">${rows.map(([c, list]) => {
    const comp = list.filter(m => m.mode !== 'coop');
    const ag = [...aggregate(comp).values()].filter(a => a.played >= Math.min(2, comp.length) && P(a.pid) && !P(a.pid).archived).sort((a, b) => b.rate - a.rate || b.wins - a.wins).slice(0, 3);
    return `<button class="item" data-act="cat-filter" data-id="${c}"><span class="gi" style="background:color-mix(in srgb,${C(c).color} 18%,transparent)">${C(c).emoji}</span><div class="grow" style="min-width:0"><div class="t ell">${esc(C(c).name)}</div><div class="s ell">${ag.length ? ag.map((a, i) => `${medal(i + 1)} ${esc(pname(a.pid))} ${pct(a.rate)}`).join(' · ') : (comp.length ? '' : 'Jeux coopératifs uniquement')}</div></div><div class="b">${list.length}</div><span class="chev">›</span></button>`;
  }).join('')}</div><p class="small muted">Un jeu à 2 catégories compte dans les deux. Touche une catégorie pour voir le classement complet de cette catégorie.</p>`;
}

/* ---------- Jeux ---------- */
VIEWS.games = () => {
  const gc = gameCounts();
  let list = activeGames();
  if (UI.gSearch) list = list.filter(g => norm(g.name).includes(norm(UI.gSearch)));
  if (UI.gCat) list = list.filter(g => g.cats.includes(UI.gCat));
  list.sort(UI.gSort === 'played' ? (a, b) => (gc[b.id] || 0) - (gc[a.id] || 0) || byName(a, b) : UI.gSort === 'recent' ? (a, b) => (lastPlayed(b.id) || '').localeCompare(lastPlayed(a.id) || '') || byName(a, b) : byName);
  const usedCats = [...new Set(activeGames().flatMap(g => g.cats))];
  const arch = S.games.filter(g => g.archived);
  let h = `<div class="btns" style="margin-top:4px"><button class="btn primary" data-act="add-game">＋ Ajouter un jeu</button><button class="btn" data-act="bulk-games">📋 Ajout en masse</button></div>`;

    <select id="gSort"><option value="name">Tri : A → Z</option><option value="played" ${UI.gSort === 'played' ? 'selected' : ''}>Tri : plus joués</option><option value="recent" ${UI.gSort === 'recent' ? 'selected' : ''}>Tri : joués récemment</option></select></div>
    <div class="small muted" style="margin:8px 2px">${plural(list.length, 'jeu', 'jeux')}</div>
    <div class="ggrid">${list.map(g => { const c = C(g.cats[0]); return `<button class="gcard" data-act="go" data-to="#/game/${g.id}"><div class="img" style="background:color-mix(in srgb,${c.color} 16%,transparent)">${g.img ? `<img src="${g.img}" alt="">` : c.emoji}</div><div class="c"><div class="n">${esc(g.name)}</div><div class="pills">${g.cats.map(catBadge).join('')}</div><div class="tiny muted" style="margin-top:4px">${MODES[g.mode].icon} ${plural(gc[g.id] || 0, 'partie')}</div></div></button>`; }).join('')}</div>`;
  if (arch.length) h += `<details class="arch"><summary>🗄 Jeux archivés (${arch.length})</summary><div class="list">${arch.sort(byName).map(g => `<button class="item" data-act="go" data-to="#/game/${g.id}">${gameIcon(g, 32)}<div class="grow t">${esc(g.name)}</div><span class="chev">›</span></button>`).join('')}</div></details>`;
  return {html: h, mount: v => {
    const s = $('#gSearch', v);
    if (s){
      s.oninput = e => { UI.gSearch = e.target.value; saveUI(); const pos = e.target.selectionStart; render(); const n = $('#gSearch'); n.focus(); n.setSelectionRange(pos, pos); };
      $('#gCat', v).onchange = e => { UI.gCat = e.target.value; saveUI(); render(); };
      $('#gSort', v).onchange = e => { UI.gSort = e.target.value; saveUI(); render(); };
    }
  }};
};
VIEWS.game = r => {
  const g = G(r.id);
  if (!g) return emptyBox('❓', 'Ce jeu n’existe plus.', `<button class="btn" data-act="go" data-to="#/games">Retour aux jeux</button>`);
  const ms = S.matches.filter(m => m.gameId === g.id).sort((a, b) => b.date.localeCompare(a.date));
  let h = `<div class="card"><div class="hero">${gameIcon(g, 72)}<div class="grow" style="min-width:0"><h2>${esc(g.name)}</h2><div class="pills" style="margin-top:6px">${g.cats.map(catBadge).join('')}${modeBadge(g.mode)}</div>
    ${g.min || g.max ? `<div class="small muted" style="margin-top:4px">👥 ${g.min && g.max ? (g.min === g.max ? g.min : g.min + ' à ' + g.max) : g.min ? g.min + ' et +' : 'jusqu’à ' + g.max} joueurs</div>` : ''}</div></div>
    ${g.notes ? `<p class="small" style="margin:10px 0 0">📝 ${esc(g.notes)}</p>` : ''}
    ${g.archived ? `<div class="banner warn small">🗄 Ce jeu est archivé : il n’apparaît plus dans la liste de choix.</div>` : ''}
    ${isTarotGame(g) && S.tarot.length ? `<div class="list" style="margin-top:10px">${S.tarot.filter(t => t.gameId === g.id).map(tarotSessionItem).join('')}</div>` : ''}<div class="btns">${g.archived ? '' : `<button class="btn primary" data-act="new-for-game" data-id="${g.id}">${isTarotGame(g) ? '🃏 Feuille de Tarot' : '＋ Nouvelle partie'}</button>`}<button class="btn" data-act="edit-game" data-id="${g.id}">✏️ Modifier</button></div></div>`;
  if (!ms.length) return h + emptyBox('🕹', 'Pas encore de partie sur ce jeu.') + gameDangerZone(g, 0);
  const durs = ms.filter(m => m.duration).map(m => m.duration);
  h += `<div class="tiles"><div class="tile"><div class="v">${ms.length}</div><div class="l">${ms.length > 1 ? "parties" : "partie"}</div></div>
    <div class="tile"><div class="v">${fmtDateShort(ms[0].date)}</div><div class="l">dernière partie</div></div>
    ${durs.length ? `<div class="tile"><div class="v">${Math.round(durs.reduce((a, b) => a + b, 0) / durs.length)} min</div><div class="l">durée moyenne</div></div>` : ''}`;
  if (g.mode === 'coop' || ms.every(m => m.mode === 'coop')){
    const w = ms.filter(m => m.coopWin).length;
    h += `<div class="tile"><div class="v">${pct(w / ms.length)}</div><div class="l">de victoires collectives</div></div></div>`;
    const agg = [...aggregate(ms).values()].sort((a, b) => b.coop - a.coop);
    h += `<div class="card"><h2>Joueurs</h2><div class="tblwrap"><table class="tbl"><tr><th>Joueur</th><th>Parties</th><th>Réussite</th></tr>${agg.map(a => `<tr class="click" data-act="go" data-to="#/player/${a.pid}"><td><div class="row">${avatar(P(a.pid), 24)}${esc(pname(a.pid))}</div></td><td>${a.coop}</td><td>${pct(a.coopWins / a.coop)}</td></tr>`).join('')}</table></div></div>`;
  } else {
    const scored = ms.filter(m => m.mode === 'high' || m.mode === 'low');
    let rec = null, winSum = 0, winN = 0;
    scored.forEach(m => {
      m.results.forEach(x => { if (rec === null || (m.mode === 'high' ? x.score > rec.score : x.score < rec.score)) rec = {score:x.score, pid:x.pid, date:m.date}; });
      m.results.filter(x => x.rank === 1).slice(0, 1).forEach(x => { winSum += x.score; winN++; });
    });
    if (rec) h += `<div class="tile"><div class="v">${fmtNum(rec.score)}</div><div class="l">record (${esc(pname(rec.pid))})</div></div><div class="tile"><div class="v">${fmtNum(Math.round(winSum / winN * 10) / 10)}</div><div class="l">score moyen du gagnant</div></div>`;
    h += `</div>`;
    const agg = [...aggregate(ms).values()].filter(a => a.played).sort((a, b) => b.rate - a.rate || b.wins - a.wins || b.played - a.played);
    const best = {}, sum = {};
    scored.forEach(m => m.results.forEach(x => { const b = best[x.pid]; if (b === undefined || (m.mode === 'high' ? x.score > b : x.score < b)) best[x.pid] = x.score; (sum[x.pid] = sum[x.pid] || []).push(x.score); }));
    h += `<div class="card"><h2>🏆 Classement sur ce jeu</h2><div class="tblwrap"><table class="tbl"><tr><th>Joueur</th><th>P</th><th>V</th><th>%V</th>${scored.length ? '<th>Record</th><th>Moy.</th>' : ''}</tr>
      ${agg.map((a, i) => `<tr class="click" data-act="go" data-to="#/player/${a.pid}"><td><div class="row">${i < 3 ? medal(i + 1) : ''}${avatar(P(a.pid), 24)}<span class="ell" style="max-width:110px">${esc(pname(a.pid))}</span></div></td><td>${a.played}</td><td>${a.wins}</td><td class="b">${pct(a.rate)}</td>${scored.length ? `<td>${fmtNum(best[a.pid])}</td><td>${sum[a.pid] ? fmtNum(Math.round(sum[a.pid].reduce((x, y) => x + y, 0) / sum[a.pid].length * 10) / 10) : '–'}</td>` : ''}</tr>`).join('')}
      </table></div><p class="tiny muted" style="margin:8px 0 0">P = parties · V = victoires · Moy. = score moyen</p></div>`;
  }
  if (isTarotGame(g)) h += tarotStatsCard(g.id);
  h += `<div class="sec">Historique</div><div class="list">${ms.slice(0, 30).map(matchCard).join('')}</div>`;
  if (ms.length > 30) h += `<div class="btns"><button class="btn" data-act="matches-for-game" data-id="${g.id}">Voir les ${ms.length} parties</button></div>`;
  return {html: h + gameDangerZone(g, ms.length), title: g.name};
};
function gameDangerZone(g, n){
  return `<div class="btns" style="margin-top:24px">${g.archived ? `<button class="btn" data-act="unarchive-game" data-id="${g.id}">♻️ Restaurer ce jeu</button>` : n ? `<button class="btn outline-danger" data-act="archive-game" data-id="${g.id}">🗄 Archiver ce jeu</button>` : ''}${!n ? `<button class="btn outline-danger" data-act="delete-game" data-id="${g.id}">🗑 Supprimer ce jeu</button>` : ''}</div>${n ? `<p class="tiny muted center">Un jeu qui a des parties ne peut pas être supprimé (pour ne pas perdre l’historique), seulement archivé.</p>` : ''}`;
}

/* ---------- Joueurs ---------- */
VIEWS.players = () => {

};
VIEWS.player = r => {
  const p = P(r.id);

  const a = aggregate(mine).get(p.id) || {played:0, wins:0, coop:0, coopWins:0, games:{}, winsByCat:{}};
  const st = streaks(p.id, mine);
  let h = `<div class="card"><div class="hero">${avatar(p, 68)}<div class="grow"><h2>${esc(p.name)}</h2>${st.form.length ? `<div class="small muted" style="margin-top:4px">Forme récente ${formDots(st.form)}</div>` : ''}</div></div>

  if (!mine.length) return h + emptyBox('🕹', 'Aucune partie pour l’instant.') + playerDangerZone(p, 0);
  h += `<div class="tiles">
    <div class="tile"><div class="v">${a.played + a.coop}</div><div class="l">parties</div></div>
    <div class="tile"><div class="v">${a.wins}</div><div class="l">victoires</div></div>

    <div class="tile"><div class="v">${pct(a.perfAvg)}</div><div class="l">performance</div></div>

    ${a.coop ? `<div class="tile"><div class="v">${pct(a.coopWins / a.coop)}</div><div class="l">réussite en coop (${a.coop})</div></div>` : ''}</div>`;
  // Par jeu
  const gl = Object.entries(a.games).filter(([gid]) => G(gid)).sort((x, y) => y[1].played - x[1].played);
  if (gl.length){
    const fav = gl[0]; const strong = gl.filter(([, d]) => d.played >= 2).sort((x, y) => y[1].wins / y[1].played - x[1].wins / x[1].played)[0];
    h += `<div class="card"><h2>🎲 Par jeu</h2><div class="small" style="margin-bottom:8px">❤️ Jeu le plus joué : <b>${esc(G(fav[0]).name)}</b>${strong ? ` · 💪 Point fort : <b>${esc(G(strong[0]).name)}</b> (${pct(strong[1].wins / strong[1].played)})` : ''}</div>
      <div class="tblwrap"><table class="tbl"><tr><th>Jeu</th><th>P</th><th>V</th><th>%V</th></tr>${gl.map(([gid, d]) => `<tr class="click" data-act="go" data-to="#/game/${gid}"><td class="ell" style="max-width:170px">${esc(G(gid).name)}</td><td>${d.played}</td><td>${d.wins}</td><td class="b">${pct(d.wins / d.played)}</td></tr>`).join('')}</table></div></div>`;
  }
  // Par catégorie
  const cat = {};
  mine.filter(m => m.mode !== 'coop').forEach(m => { const g = G(m.gameId); if (!g) return; const l = line(m, p.id); g.cats.forEach(c => { const d = cat[c] || (cat[c] = {n:0, w:0}); d.n++; if (l.win) d.w++; }); });
  const cl = Object.entries(cat).sort((x, y) => y[1].n - x[1].n);
  if (cl.length) h += `<div class="card"><h2>🏷 Par catégorie</h2>${cl.map(([c, d]) => `<div style="margin:8px 0"><div class="row small"><span class="grow">${C(c).emoji} ${esc(C(c).name)}</span><span class="muted">${d.w}/${d.n}</span><b style="width:48px;text-align:right">${pct(d.w / d.n)}</b></div><div class="bar"><span style="width:${d.w / d.n * 100}%;background:${C(c).color}"></span></div></div>`).join('')}</div>`;
  // Rivaux
  const riv = S.players.filter(q => q.id !== p.id).map(q => ({q, d: h2h(p.id, q.id, mine)})).filter(x => x.d.n);
  if (riv.length){
    const nem = riv.filter(x => x.d.n >= 3).sort((x, y) => (y.d.b - y.d.a) / y.d.n - (x.d.b - x.d.a) / x.d.n)[0];
    const prey = riv.filter(x => x.d.n >= 3).sort((x, y) => (y.d.a - y.d.b) / y.d.n - (x.d.a - x.d.b) / x.d.n)[0];
    h += `<div class="card"><h2>⚔️ Contre les autres</h2>
      ${nem && nem.d.b > nem.d.a ? `<div class="small">😈 Bête noire : <b>${esc(nem.q.name)}</b> (${nem.d.a}–${nem.d.b})</div>` : ''}
      ${prey && prey.d.a > prey.d.b ? `<div class="small" style="margin-bottom:6px">🎯 Victime préférée : <b>${esc(prey.q.name)}</b> (${prey.d.a}–${prey.d.b})</div>` : ''}
      <div class="tblwrap"><table class="tbl"><tr><th>Adversaire</th><th>Ensemble</th><th>Devant</th><th>Derrière</th></tr>${riv.sort((x, y) => y.d.n - x.d.n).map(x => `<tr class="click" data-act="h2h-with" data-a="${p.id}" data-b="${x.q.id}"><td><div class="row">${avatar(x.q, 22)}<span class="ell" style="max-width:110px">${esc(x.q.name)}</span></div></td><td>${x.d.n}</td><td class="${x.d.a > x.d.b ? 'b' : ''}">${x.d.a}</td><td class="${x.d.b > x.d.a ? 'b' : ''}">${x.d.b}</td></tr>`).join('')}</table></div>
      <p class="tiny muted" style="margin:8px 0 0">Devant = nombre de parties où ${esc(p.name)} a fini devant cet adversaire. Touche une ligne pour le face-à-face détaillé.</p></div>`;
  }
  h += `<div class="sec">Dernières parties</div><div class="list">${[...mine].sort((x, y) => y.date.localeCompare(x.date)).slice(0, 10).map(matchCard).join('')}</div>`;
  return {html: h + playerDangerZone(p, mine.length), title: p.name};
};
function playerDangerZone(p, n){
  return `<div class="btns" style="margin-top:24px">${p.archived ? `<button class="btn" data-act="unarchive-player" data-id="${p.id}">♻️ Restaurer ce joueur</button>` : n ? `<button class="btn outline-danger" data-act="archive-player" data-id="${p.id}">🗄 Archiver ce joueur</button>` : ''}${!n ? `<button class="btn outline-danger" data-act="delete-player" data-id="${p.id}">🗑 Supprimer ce joueur</button>` : ''}</div>${n ? `<p class="tiny muted center">Un joueur qui a des parties ne peut pas être supprimé (pour garder l’historique juste), seulement archivé.</p>` : ''}`;
}

   SAISIE D'UNE PARTIE

let D = null; // brouillon courant
function loadDraft(){ try { return JSON.parse(localStorage.getItem(DRAFT_KEY)); } catch { return null; } }
function saveDraft(){ try { if (D) localStorage.setItem(DRAFT_KEY, JSON.stringify(D)); else localStorage.removeItem(DRAFT_KEY); } catch {} }
function clearDraft(){ D = null; localStorage.removeItem(DRAFT_KEY); }
function newDraft(o = {}){ return Object.assign({editId:null, gameId:null, pids:[], scores:{}, wins:{}, teams:{}, teamScores:{}, teamCount:2, winTeam:null, coopWin:null, coopScore:'', date:toLocalInput(new Date()), duration:'', notes:'', gameSearch:'', playerSearch:''}, o); }
function draftHasContent(d){ return !!(d && (d.gameId || d.pids.length)); }
function draftFromMatch(m){
  const d = newDraft({editId:m.id, gameId:m.gameId, pids:m.results.map(r => r.pid), date:toLocalInput(m.date), duration:m.duration ? String(m.duration) : '', notes:m.notes || '', coopWin: m.mode === 'coop' ? !!m.coopWin : null, coopScore: typeof m.coopScore === 'number' ? String(m.coopScore) : '', winTeam:m.winTeam || null, modeOverride:m.mode});
  m.results.forEach(r => { if (typeof r.score === 'number') d.scores[r.pid] = String(r.score); if (r.win) d.wins[r.pid] = true; if (r.team) d.teams[r.pid] = r.team; });
  if (m.teamScores) Object.entries(m.teamScores).forEach(([t, v]) => { if (typeof v === 'number') d.teamScores[t] = String(v); });
  if (m.mode === 'teams') d.teamCount = Math.max(2, ...m.results.map(r => TEAM_IDS.indexOf(r.team) + 1));
  return d;
}
function draftMode(){ const g = G(D.gameId); return D.modeOverride || (g ? g.mode : 'high'); }

function buildMatch(){
  const g = G(D.gameId);
  const mode = draftMode();
  const errors = [], warnings = [];
  if (!g){ errors.push('Choisis un jeu.'); return {errors, warnings}; }
  const n = D.pids.length;
  if (mode === 'coop' ? n < 1 : n < 2) errors.push(mode === 'coop' ? 'Ajoute au moins 1 joueur.' : 'Il faut au moins 2 joueurs.');
  const results = D.pids.map(pid => ({pid}));
  const m = {id: D.editId || uid(), gameId: g.id, mode, results, date: null, duration: null, notes: cleanName(D.notes) || ''};
  if (mode === 'high' || mode === 'low'){
    results.forEach(r => { const v = parseNum(D.scores[r.pid]); r.score = v; if (v === null) errors.push(`Score manquant pour ${pname(r.pid)}.`); else if (Number.isNaN(v)) errors.push(`Score invalide pour ${pname(r.pid)}.`); });
  } else if (mode === 'winner'){
    results.forEach(r => r.win = !!D.wins[r.pid]);
    const nw = results.filter(r => r.win).length;
    if (n && !nw) errors.push('Touche 👑 pour désigner le ou les gagnants.');
    if (n > 1 && nw === n) warnings.push('Tous les joueurs sont marqués gagnants.');
  } else if (mode === 'teams'){
    results.forEach(r => { r.team = D.teams[r.pid] || null; if (!r.team) errors.push(`Choisis l’équipe de ${pname(r.pid)}.`); });
    const used = [...new Set(results.map(r => r.team).filter(Boolean))];
    if (n >= 2 && used.length < 2 && !results.some(r => !r.team)) errors.push('Il faut au moins 2 équipes différentes.');
    const ts = {}; used.forEach(t => ts[t] = parseNum(D.teamScores[t]));
    const nums = used.filter(t => typeof ts[t] === 'number' && !Number.isNaN(ts[t]));
    if (used.some(t => Number.isNaN(ts[t]))) errors.push('Un score d’équipe est invalide.');
    else if (nums.length && nums.length < used.length) errors.push('Score manquant pour une équipe (ou efface tous les scores et choisis l’équipe gagnante).');
    else if (!nums.length && used.length >= 2 && !used.includes(D.winTeam)) errors.push('Entre les points des équipes ou touche 👑 sur l’équipe gagnante.');
    m.teamScores = {}; used.forEach(t => m.teamScores[t] = typeof ts[t] === 'number' && !Number.isNaN(ts[t]) ? ts[t] : null);
    m.winTeam = nums.length ? null : D.winTeam;
  } else if (mode === 'coop'){
    if (D.coopWin === null || D.coopWin === undefined) errors.push('Indique si vous avez gagné ou perdu.');
    m.coopWin = !!D.coopWin;
    const cs = parseNum(D.coopScore);
    if (Number.isNaN(cs)) errors.push('Score collectif invalide.');
    m.coopScore = typeof cs === 'number' && !Number.isNaN(cs) ? cs : null;
  }
  const dt = new Date(D.date);
  if (!D.date || isNaN(dt)) errors.push('Date invalide.');
  else { m.date = dt.toISOString(); if (dt.getTime() > Date.now() + 3600e3) warnings.push('La date est dans le futur.'); }
  const dur = parseNum(D.duration);
  if (Number.isNaN(dur) || (typeof dur === 'number' && dur < 0)) errors.push('Durée invalide.');
  else m.duration = dur ? Math.round(dur) : null;
  if (g.min && n && n < g.min) warnings.push(`${g.name} se joue normalement à ${g.min} joueurs minimum.`);
  if (g.max && n > g.max) warnings.push(`${g.name} se joue normalement à ${g.max} joueurs maximum.`);
  if (!errors.length){
    computeRanks(m);
    const sig = x => x.gameId + '|' + x.results.map(r => r.pid + ':' + (r.score ?? '') + (r.win ? 'W' : '') + (r.team || '')).sort().join(',');
    const dup = S.matches.find(o => o.id !== m.id && sig(o) === sig(m) && Math.abs(new Date(o.date) - dt) < 12 * 3600e3);
    if (dup) warnings.push(`Une partie identique (même jeu, mêmes joueurs, mêmes résultats) est déjà enregistrée le ${fmtDate(dup.date)}. Doublon ?`);
  }
  return {errors, warnings, m};
}

VIEWS.new = VIEWS.edit = r => {

    const lastM = sortedMatches()[0];
    h += `<div class="card"><h2>2 · Joueurs <span class="muted small">(${D.pids.length}${g.min || g.max ? ' · conseillé : ' + (g.min || 1) + (g.max ? '–' + g.max : '+') : ''})</span></h2>`;
    if (D.pids.length) h += `<div class="chips" style="margin-bottom:10px">${D.pids.map(id => `<button class="chip on" data-act="nm-remove-player" data-id="${id}">${avatar(P(id), 24)}${esc(pname(id))} ✕</button>`).join('')}</div>`;
    const quick = [];
    if (lastM && !isEdit && !D.pids.length) quick.push(`<button class="chip noav" data-act="nm-same-players">🔁 Comme la dernière partie</button>`);
    S.groups.forEach(gr => quick.push(`<button class="chip noav" data-act="nm-group" data-id="${gr.id}">📁 ${esc(gr.name)}</button>`));
    if (quick.length) h += `<div class="chips" style="margin-bottom:8px">${quick.join('')}</div>`;
    if (activePlayers().length > 12) h += `<input type="search" id="nmPlayerSearch" placeholder="🔍 Filtrer les joueurs…" value="${esc(D.playerSearch || '')}" style="margin-bottom:8px">`;
    h += `<div class="chips" id="nmAvail">${availChips(avail)}</div>

        h += D.pids.map(id => { const v = D.scores[id] || ''; return `<div class="srow">${avatar(P(id), 32)}<span class="nm ell">${esc(pname(id))}</span><button class="sign ${String(v).startsWith('-') ? 'neg' : ''}" data-act="nm-sign" data-id="${id}">±</button><input type="text" inputmode="decimal" enterkeyhint="next" class="nmScore" data-id="${id}" value="${esc(v)}" placeholder="pts" autocomplete="off"></div>`; }).join('');

        h += `<div class="row" style="margin:8px 0"><span class="small muted grow">Nombre d’équipes : ${D.teamCount}</span>${D.teamCount > 2 ? `<button class="btn small" data-act="nm-teams" data-d="-1">−</button>` : ''}${D.teamCount < 4 ? `<button class="btn small" data-act="nm-teams" data-d="1">＋</button>` : ''}</div>`;
        h += tids.filter(t => D.pids.some(id => D.teams[id] === t)).map(t => `<div class="srow"><span class="badge" style="--c:${TEAM_COLORS[t]};font-size:14px">Équipe ${t}</span><span class="nm small muted ell">${D.pids.filter(id => D.teams[id] === t).map(pname).map(esc).join(', ')}</span><button class="crown ${D.winTeam === t ? 'on' : ''}" data-act="nm-winteam" data-team="${t}" title="Équipe gagnante (si pas de points)">👑</button><input type="text" inputmode="decimal" class="nmTeamScore" data-team="${t}" value="${esc(D.teamScores[t] || '')}" placeholder="pts" style="width:90px"></div>`).join('');
      } else if (mode === 'coop'){

      <label class="f">Notes<textarea id="nmNotes" placeholder="ex : extension utilisée, anecdote…">${esc(D.notes)}</textarea></label></details>`;
  }

  return {html: h, title: isEdit ? 'Modifier la partie' : 'Nouvelle partie', mount: v => {

    if (ps) ps.oninput = e => { D.playerSearch = e.target.value; saveDraft(); const pc = playCounts(); $('#nmAvail').innerHTML = availChips(activePlayers().filter(p => !D.pids.includes(p.id)).sort((a, b) => (pc[b.id] || 0) - (pc[a.id] || 0) || byName(a, b))); };

      inp.onkeydown = e => { if (e.key === 'Enter'){ e.preventDefault(); if (inputs[i + 1]) inputs[i + 1].focus(); else inp.blur(); } };
    });
    $$('.nmTeamScore', v).forEach(inp => inp.oninput = () => { D.teamScores[inp.dataset.team] = inp.value; saveDraft(); updatePreview(); });
    const bind = (id, key) => { const el = $(id, v); if (el) el.oninput = () => { D[key] = el.value; saveDraft(); updatePreview(); }; };
    bind('#nmCoopScore', 'coopScore'); bind('#nmDate', 'date'); bind('#nmDuration', 'duration'); bind('#nmNotes', 'notes');

function availChips(avail){
  const q = norm(D.playerSearch || '');
  const list = q ? avail.filter(p => norm(p.name).includes(q)) : avail;
  if (!activePlayers().length) return `<span class="small muted">Aucun joueur enregistré : crée le premier ⬇️</span>`;
  if (!list.length) return `<span class="small muted">${avail.length ? 'Aucun joueur ne correspond.' : 'Tous les joueurs sont sélectionnés.'}</span>`;
  return list.map(p => `<button class="chip" data-act="nm-add-player" data-id="${p.id}">${avatar(p, 24)}${esc(p.name)}</button>`).join('');
