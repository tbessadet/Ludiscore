function gameChoices(){
  const q = norm(D.gameSearch || '');
  const games = activeGames();
  if (!games.length) return `<p class="small muted">Aucun jeu enregistré.</p><button class="btn primary" data-act="nm-new-game">＋ Créer un jeu</button>`;
  let h = '';
  const item = g => `<button class="item" data-act="nm-pick-game" data-id="${g.id}">${gameIcon(g, 36)}<div class="grow" style="min-width:0"><div class="t ell">${esc(g.name)}</div><div class="s ell">${g.cats.map(c => C(c).emoji + ' ' + esc(C(c).name)).join(' · ')}</div></div></button>`;
  if (!q){
    const recent = [...new Set(sortedMatches().map(m => m.gameId))].map(G).filter(g => g && !g.archived).slice(0, 5);
    if (recent.length) h += `<div class="small muted b" style="margin:2px">Récents</div>` + recent.map(item).join('') + `<div class="small muted b" style="margin:8px 2px 2px">Tous les jeux</div>`;
    h += [...games].sort(byName).filter(g => !recent.includes(g)).map(item).join('');
  } else {
    const list = games.filter(g => norm(g.name).includes(q)).sort(byName);
    h += list.map(item).join('');
    const exact = games.some(g => norm(g.name) === q);
    if (!list.length) h += `<p class="small muted">Aucun jeu ne correspond à « ${esc(D.gameSearch)} ».</p>`;
    if (!exact) h += `<button class="btn" data-act="nm-new-game">＋ Créer le jeu « ${esc(cleanName(D.gameSearch))} »</button>`;
    return h;
  }
  return h + `<button class="btn" data-act="nm-new-game" style="margin-top:4px">＋ Créer un nouveau jeu</button>`;
}
function updatePreview(){
  const box = $('#nmPreview'); if (!box) return;
  const {errors, warnings, m} = buildMatch();
  let h = '';
  if (!errors.length && m){
    const rs = [...m.results].sort((a, b) => a.rank - b.rank);
    if (m.mode === 'coop') h += `<div class="prow b">${m.coopWin ? '🎉 Victoire collective' : '💀 Défaite collective'}</div>`;
    else if (m.mode === 'teams'){

      h += teams.map(t => { const mem = rs.filter(r => r.team === t); return `<div class="prow"><span class="rk">${medal(mem[0].rank)}</span><b>Équipe ${t}</b><span class="muted small ell">${mem.map(r => esc(pname(r.pid))).join(', ')}</span></div>`; }).join('');

async function saveMatchDraft(){

  commit(isEdit ? 'Partie modifiée ✔' : 'Partie enregistrée 🎉', () => {
    if (isEdit){ const i = S.matches.findIndex(x => x.id === m.id); const old = S.matches[i]; m.createdAt = old ? old.createdAt : Date.now(); m.updatedAt = Date.now(); if (i >= 0) S.matches[i] = m; else S.matches.push(m); }

function resizeImage(file, max){
  return new Promise((res, rej) => {
    const rd = new FileReader();
    rd.onload = () => { const im = new Image(); im.onload = () => {
      const s = Math.min(1, max / Math.max(im.width, im.height));
      const cv = document.createElement('canvas'); cv.width = Math.round(im.width * s); cv.height = Math.round(im.height * s);
      cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
      res(cv.toDataURL('image/jpeg', 0.78));
    }; im.onerror = rej; im.src = rd.result; };
    rd.onerror = rej; rd.readAsDataURL(file);
  });
}

const tarotLastDate = t => t.rounds.length ? t.rounds[t.rounds.length - 1].date : t.startedAt;

/** Calcule les points de chaque joueur pour une manche. */
function tarotScore(r, pids){
  const n = pids.length, res = {};
  pids.forEach(p => res[p] = 0);
  const target = TAROT_TARGET[r.bouts];
  const made = r.points >= target, s = made ? 1 : -1;
  const ecart = Math.ceil(Math.abs(r.points - target) - 1e-9);
  const mult = TAROT_CONTRACTS[r.contract].mult;
  const petit = r.petit === 'att' ? 10 : r.petit === 'def' ? -10 : 0;
  // Valeur « par défenseur » : (25 + écart ± petit au bout) × contrat, + poignées (au camp gagnant), + chelem
  let unit = (s * (25 + ecart) + petit) * mult;
  const pg = r.poignees || {};
  const poig = Object.keys(TAROT_POIGNEES).reduce((a, k) => a + (pg[k] || 0) * TAROT_POIGNEES[k].pts, 0);
  unit += s * poig;
  if (r.chelem && TAROT_CHELEM[r.chelem]) unit += TAROT_CHELEM[r.chelem].pts;
  const withPartner = n === 5 && r.partner && r.partner !== r.taker;
  pids.forEach(p => { if (p !== r.taker && !(withPartner && p === r.partner)) res[p] -= unit; });
  if (withPartner){ res[r.taker] += 2 * unit; res[r.partner] += unit; }
  else res[r.taker] += (n - 1) * unit;
  // Misères : chaque misère rapporte 10 points de chaque adversaire
  const mis = r.miseres || {};
  [...(mis.tete || []), ...(mis.atout || [])].forEach(p => {
    if (!(p in res)) return;
    pids.forEach(q => { res[q] += q === p ? MISERE_PTS * (n - 1) : -MISERE_PTS; });
  });
  return {res, made, ecart, target, unit, mult, poig};
}
function tarotTotals(t){
  const tot = {}; t.pids.forEach(p => tot[p] = 0);
  t.rounds.forEach(r => { const {res} = tarotScore(r, t.pids); t.pids.forEach(p => tot[p] += res[p]); });
  return tot;
}
const signed = n => (n > 0 ? '+' : n < 0 ? '−' : '') + fmtNum(Math.abs(n));
function deltaPills(res, pids){
  return pids.map(p => `<span class="pill" style="${res[p] > 0 ? 'color:var(--ok);font-weight:700' : res[p] < 0 ? 'color:var(--danger)' : ''}">${esc(pname(p))} ${signed(res[p])}</span>`).join('');
}
function roundTitle(r, t){
  const partner = t.pids.length === 5 ? (r.partner && r.partner !== r.taker ? ' + ' + esc(pname(r.partner)) : ' (seul)') : '';
  return `${esc(pname(r.taker))}${partner} · ${TAROT_CONTRACTS[r.contract].label} · ${plural(r.bouts, 'bout')} · ${fmtNum(r.points)} pts`;
}
function roundBonusText(r){
  const b = [];
  if (r.petit) b.push('Petit au bout ' + (r.petit === 'att' ? 'attaque' : 'défense'));
  Object.keys(TAROT_POIGNEES).forEach(k => { const c = (r.poignees || {})[k]; if (c) b.push(`${c > 1 ? c + '× ' : ''}poignée ${TAROT_POIGNEES[k].label.toLowerCase()}`); });
  if (r.chelem) b.push('Chelem ' + TAROT_CHELEM[r.chelem].label.toLowerCase());
  const mis = r.miseres || {};
  (mis.tete || []).forEach(p => b.push('Misère de tête ' + pname(p)));
  (mis.atout || []).forEach(p => b.push('Misère d’atout ' + pname(p)));
  return b.map(esc).join(' · ');
}

/* ---------- Pages ---------- */
VIEWS.tarot = r => {
  if (r.id) return vTarotSession(r.id);
  const g = tarotGame();
  let h = `<div class="card"><div class="hero">${g ? gameIcon(g, 56) : '<span class="gi" style="width:56px;height:56px">🃏</span>'}<div><h2>Feuille de Tarot</h2><div class="small muted">Règle officielle FFT · 3, 4 ou 5 joueurs</div></div></div>
    <p class="small" style="margin:10px 0 0">Saisis chaque manche (preneur, contrat, bouts, points, annonces) : les scores se calculent tout seuls. La partie reste ouverte d’une soirée à l’autre ; <b>« Clôturer la partie »</b> l’enregistre dans l’historique et les statistiques.</p>
    ${g ? `<div class="btns"><button class="btn primary" data-act="tarot-new">＋ Nouvelle partie de Tarot</button></div>` : `<div class="banner warn small">Aucun jeu n’utilise la feuille de Tarot.</div><div class="btns"><button class="btn primary" data-act="tarot-create-game">Créer le jeu « Tarot »</button></div>`}</div>`;
  const open = [...S.tarot].sort((a, b) => tarotLastDate(b).localeCompare(tarotLastDate(a)));
  if (open.length) h += `<div class="sec">Parties en cours</div><div class="list">${open.map(tarotSessionItem).join('')}</div>`;
  else if (g) h += `<p class="small muted center">Aucune partie en cours.</p>`;
  const done = S.matches.filter(m => m.tarot).length;
  if (done) h += `<p class="small muted center"><a href="#" data-act="matches-for-game" data-id="${g ? g.id : ''}">${plural(done, 'partie clôturée', 'parties clôturées')} dans l’historique</a></p>`;
  return {html: h, title: 'Tarot'};
};
function tarotSessionItem(t){
  const tot = tarotTotals(t);
  const lead = [...t.pids].sort((a, b) => tot[b] - tot[a])[0];
  return `<button class="item" data-act="go" data-to="#/tarot/${t.id}"><span class="gi" style="background:color-mix(in srgb,#78350f 18%,transparent)">🃏</span><div class="grow" style="min-width:0"><div class="t ell">${t.pids.map(pname).map(esc).join(', ')}</div><div class="s ell">${plural(t.rounds.length, 'manche')} · ${fmtDateShort(tarotLastDate(t))}${t.rounds.length ? ` · en tête : ${esc(pname(lead))} (${signed(tot[lead])})` : ''}</div></div><span class="chev">›</span></button>`;
}
function vTarotSession(id){
  const t = S.tarot.find(x => x.id === id);
  if (!t) return {html: emptyBox('🃏', 'Cette partie de Tarot est clôturée ou n’existe plus.', `<button class="btn" data-act="go" data-to="#/tarot">Parties de Tarot</button>`), title:'Tarot'};
  const tot = tarotTotals(t);
  const order = [...t.pids].sort((a, b) => tot[b] - tot[a]);
  const last = t.rounds[t.rounds.length - 1];
  const lastRes = last ? tarotScore(last, t.pids).res : null;
  const rank = p => 1 + t.pids.filter(q => tot[q] > tot[p]).length;
  let h = `<div class="card"><div class="row"><div class="grow"><div class="b">🃏 Partie à ${t.pids.length} joueurs</div><div class="small muted">Commencée ${fmtDate(t.startedAt)} · ${plural(t.rounds.length, 'manche')}</div></div></div>
    <div class="preview" style="margin-top:10px">${order.map(p => `<div class="prow" style="padding:4px 0"><span class="rk">${t.rounds.length ? medal(rank(p)) : ''}</span>${avatar(P(p), 32)}<span class="grow b ell">${esc(pname(p))}</span>${lastRes ? `<span class="small" style="color:${lastRes[p] >= 0 ? 'var(--ok)' : 'var(--danger)'}">${signed(lastRes[p])}</span>` : ''}<span style="font-size:20px;font-weight:800;min-width:70px;text-align:right">${fmtNum(tot[p])}</span></div>`).join('')}</div>
    <div class="btns"><button class="btn primary block" data-act="tarot-round" data-sid="${t.id}" style="padding:14px">＋ Nouvelle manche</button></div></div>`;
  if (t.rounds.length){
    h += `<div class="sec">Manches</div>`;
    let curDay = '';
    const list = t.rounds.map((r, i) => ({r, i})).reverse();
    h += list.map(({r, i}) => {
      const sc = tarotScore(r, t.pids);
      const day = fmtDate(r.date, {weekday:'long', day:'numeric', month:'long'});
      let head = '';
      if (day !== curDay){ const nDay = t.rounds.filter(x => fmtDate(x.date, {weekday:'long', day:'numeric', month:'long'}) === day).length; head = `<div class="month">${day} · ${plural(nDay, 'manche')}</div>`; curDay = day; }
      const bonus = roundBonusText(r);
      return head + `<button class="match" style="margin-bottom:8px" data-act="tarot-round" data-sid="${t.id}" data-rid="${r.id}"><span class="gi" style="width:36px;height:36px;font-size:15px;font-weight:800;background:${sc.made ? 'color-mix(in srgb,var(--ok) 18%,transparent)' : 'color-mix(in srgb,var(--danger) 15%,transparent)'}">${i + 1}</span><div class="mbody"><div class="small b">${roundTitle(r, t)}</div><div class="small" style="color:${sc.made ? 'var(--ok)' : 'var(--danger)'};font-weight:600">${sc.made ? '✅ Réussi' : '❌ Chuté'} de ${sc.ecart}${bonus ? ` <span class="muted" style="font-weight:400">· ${bonus}</span>` : ''}</div><div class="pills">${deltaPills(sc.res, t.pids)}</div></div></button>`;
    }).join('');
  }
  h += `<div class="btns" style="margin-top:18px"><button class="btn" data-act="tarot-close" data-sid="${t.id}" ${t.rounds.length ? '' : 'disabled'}>🏁 Clôturer la partie</button></div>
    <div class="btns"><button class="btn outline-danger" data-act="tarot-abandon" data-sid="${t.id}">🗑 Abandonner cette partie</button></div>
    <p class="tiny muted center">Tout est enregistré à chaque manche : tu peux fermer l’appli et reprendre plus tard depuis l’accueil.</p>`;
  return {html: h, title: 'Tarot'};
}

/* ---------- Nouvelle partie de Tarot ---------- */
function tarotNewForm(preset){
  let sel = (preset || []).filter(id => P(id) && !P(id).archived).slice(0, 5);
  const draw = () => {
    const pc = playCounts();
    const pl = activePlayers().sort((a, b) => (pc[b.id] || 0) - (pc[a.id] || 0) || byName(a, b));
    const n = sel.length;
    $('#sheetBody').innerHTML = `<h2>🃏 Nouvelle partie de Tarot</h2>
      <p class="small muted" style="margin:0">Choisis 3, 4 ou 5 joueurs. Ils resteront les mêmes jusqu’à la clôture.</p>
      ${S.groups.length ? `<div class="chips" style="margin-top:10px">${S.groups.map(gr => `<button type="button" class="chip noav" data-tn="group" data-id="${gr.id}">📁 ${esc(gr.name)}</button>`).join('')}</div>` : ''}
      <div class="chips" style="margin-top:10px">${pl.map(p => `<button type="button" class="chip ${sel.includes(p.id) ? 'on' : ''}" data-tn="p" data-id="${p.id}">${avatar(p, 24)}${esc(p.name)}</button>`).join('')}</div>
      <div class="btns"><button type="button" class="btn small" data-tn="newp">＋ Nouveau joueur</button></div>
      <div class="hint ${n > 5 ? 'err' : n >= 3 ? 'ok' : 'muted'}">${n} joueur${n > 1 ? 's' : ''} sélectionné${n > 1 ? 's' : ''}${n === 5 ? ' · à 5, le preneur appelle un roi' : ''}${n > 5 ? ' · 5 maximum' : ''}</div>
      <div class="btns"><button class="btn" data-act="close-sheet">Annuler</button><button class="btn primary" data-tn="start" style="flex:2" ${n >= 3 && n <= 5 ? '' : 'disabled'}>Commencer</button></div>`;
  };
  openSheet('', b => {
    draw();
    b.onclick = e => {
      const el = e.target.closest('[data-tn]'); if (!el) return;
      const k = el.dataset.tn;
      if (k === 'p'){ const id = el.dataset.id; sel = sel.includes(id) ? sel.filter(x => x !== id) : [...sel, id]; draw(); }
      else if (k === 'group'){ const gr = S.groups.find(g => g.id === el.dataset.id); sel = gr.pids.filter(id => P(id) && !P(id).archived); draw(); }
      else if (k === 'newp'){ const keep = sel; playerForm(null, p => { tarotNewForm([...keep, p.id]); }); }
      else if (k === 'start'){
        if (sel.length < 3 || sel.length > 5) return;
        const id = uid();
        commit('Partie de Tarot commencée', () => { S.tarot.push({id, gameId: tarotGame().id, pids: sel, startedAt: new Date().toISOString(), rounds: []}); }, {render:false, undo:false});
        go('#/tarot/' + id);
      }
    };
  });
}

/* ---------- Saisie d'une manche ---------- */
function tarotRoundForm(sid, rid){
  const t = S.tarot.find(x => x.id === sid); if (!t) return;
  const n = t.pids.length;
  const ex = rid ? t.rounds.find(r => r.id === rid) : null;
  const num = ex ? t.rounds.indexOf(ex) + 1 : t.rounds.length + 1;
  const R = ex ? JSON.parse(JSON.stringify(ex)) : {taker:null, partner:null, contract:null, bouts:null, points:null, petit:'', poignees:{simple:0, double:0, triple:0}, chelem:'', miseres:{tete:[], atout:[]}};
  R.poignees = Object.assign({simple:0, double:0, triple:0}, R.poignees || {});
  R.miseres = {tete: [...((R.miseres || {}).tete || [])], atout: [...((R.miseres || {}).atout || [])]};
  let ptsStr = ex ? String(ex.points).replace('.', ',') : '';
  let countDef = false;
  let bonusOpen = !!(ex && (R.petit || R.chelem || R.poignees.simple || R.poignees.double || R.poignees.triple || R.miseres.tete.length || R.miseres.atout.length));
  const attPoints = () => { const v = parseNum(ptsStr); if (v === null || Number.isNaN(v)) return v; return countDef ? 91 - v : v; };
  const errors = () => {
    const e = [];
    if (!R.taker) e.push('Qui a pris ?');
    if (n === 5 && !R.partner) e.push('Qui a été appelé (ou le preneur seul) ?');
    if (!R.contract) e.push('Quel contrat ?');
    if (R.bouts === null || R.bouts === undefined) e.push('Combien de bouts pour l’attaque ?');
    const v = attPoints();
    if (v === null) e.push('Points de l’attaque ?');
    else if (Number.isNaN(v)) e.push('Points invalides.');
    else if (v < 0 || v > 91) e.push('Les points doivent être entre 0 et 91.');
    else if (Math.round(v * 2) !== v * 2) e.push('Points : uniquement des entiers ou des demi-points (ex : 40,5).');
    return e;
  };
  const chip = (key, val, label, on, extra = '') => `<button type="button" class="chip ${on ? 'on' : ''} ${extra}" data-tr="${key}" data-v="${val}">${label}</button>`;
  const pchip = (key, p, on) => `<button type="button" class="chip ${on ? 'on' : ''}" data-tr="${key}" data-v="${p}">${avatar(P(p), 24)}${esc(pname(p))}</button>`;
  const segBtns = (key, opts, cur) => `<div class="seg" style="flex-wrap:wrap">${opts.map(([v, l]) => `<button type="button" class="${String(cur) === String(v) ? 'on' : ''}" data-tr="${key}" data-v="${v}">${l}</button>`).join('')}</div>`;
  const preview = () => {
    const e = errors();
    if (e.length) return `<div class="msgs"><div class="e">• ${esc(e[0])}${e.length > 1 ? ` <span class="muted">(+${e.length - 1})</span>` : ''}</div></div>`;
    const r = Object.assign({}, R, {points: attPoints()});
    const sc = tarotScore(r, t.pids);
    return `<div class="card" style="margin:6px 0;padding:10px 12px"><div class="small">Il fallait <b>${sc.target}</b> (${plural(r.bouts, 'bout')}) · attaque <b>${fmtNum(r.points)}</b> → <b style="color:${sc.made ? 'var(--ok)' : 'var(--danger)'}">${sc.made ? '✅ Réussi' : '❌ Chuté'} de ${sc.ecart}</b></div>
      <div class="tiny muted" style="margin-top:2px">Valeur par défenseur : ${fmtNum(Math.abs(sc.unit))} pts (${TAROT_CONTRACTS[r.contract].label} ×${sc.mult})</div>
      <div class="pills" style="margin-top:6px">${deltaPills(sc.res, t.pids)}</div></div>`;
  };
  const html = () => `<h2>Manche ${num}${ex ? ' · modifier' : ''}</h2>
    <label class="f">Preneur</label><div class="chips" style="margin-top:6px">${t.pids.map(p => pchip('taker', p, R.taker === p)).join('')}</div>
    ${n === 5 ? `<label class="f">Joueur appelé (roi)</label><div class="chips" style="margin-top:6px">${t.pids.filter(p => p !== R.taker).map(p => pchip('partner', p, R.partner === p)).join('')}${R.taker ? chip('partner', R.taker, '🙋 Seul (s’est appelé)', R.partner === R.taker, 'noav') : ''}</div>` : ''}
    <label class="f">Contrat</label>${segBtns('contract', Object.entries(TAROT_CONTRACTS).map(([k, c]) => [k, `${c.label} ×${c.mult}`]), R.contract)}
    <label class="f">Bouts de l’attaque</label>${segBtns('bouts', [0, 1, 2, 3].map(b => [b, `${b} bout${b > 1 ? 's' : ''} · ${TAROT_TARGET[b]}`]), R.bouts)}
    <label class="f">Points ${countDef ? 'de la défense' : 'de l’attaque'} (sur 91)</label>
    <div class="row" style="margin-top:5px"><input type="text" inputmode="decimal" id="trPts" value="${esc(ptsStr)}" placeholder="ex : 47,5" style="font-size:20px;font-weight:800;text-align:center" autocomplete="off"><button type="button" class="btn small" data-tr="countdef" style="white-space:nowrap">${countDef ? '↔️ Saisir l’attaque' : '↔️ J’ai compté la défense'}</button></div>
    ${countDef && attPoints() !== null && !Number.isNaN(attPoints()) ? `<div class="hint muted">→ l’attaque a donc ${fmtNum(attPoints())} points</div>` : ''}
    <details class="card" style="margin-top:14px;padding:10px 12px" ${bonusOpen ? 'open' : ''} id="trBonus"><summary class="b">✨ Annonces & bonus <span class="muted small">(facultatif)</span></summary>
      <label class="f">Petit au bout</label>${segBtns('petit', [['', 'Non'], ['att', '✅ Gagné par l’attaque'], ['def', '❌ Gagné par la défense']], R.petit)}
      <label class="f">Poignées annoncées <span class="muted">(points pour le camp gagnant de la manche)</span></label>
      ${Object.entries(TAROT_POIGNEES).map(([k, pg]) => `<div class="srow"><span class="nm">${pg.label} <span class="muted small">· ${pg.pts} pts · ${pg.atouts}</span></span><button type="button" class="sign" data-tr="poig" data-k="${k}" data-d="-1">−</button><b style="width:20px;text-align:center">${R.poignees[k]}</b><button type="button" class="sign" data-tr="poig" data-k="${k}" data-d="1">＋</button></div>`).join('')}
      <label class="f">Chelem (attaque)</label>${segBtns('chelem', [['', 'Non'], ...Object.entries(TAROT_CHELEM).map(([k, c]) => [k, `${c.label} (${c.pts > 0 ? '+' : ''}${c.pts})`])], R.chelem)}
      <label class="f">Misère de tête <span class="muted">(+${MISERE_PTS} pts de chaque adversaire)</span></label><div class="chips" style="margin-top:6px">${t.pids.map(p => pchip('mtete', p, R.miseres.tete.includes(p))).join('')}</div>
      <label class="f">Misère d’atout <span class="muted">(+${MISERE_PTS} pts de chaque adversaire)</span></label><div class="chips" style="margin-top:6px">${t.pids.map(p => pchip('matout', p, R.miseres.atout.includes(p))).join('')}</div>
    </details>
    <div id="trPreview">${preview()}</div>
    <div class="btns"><button type="button" class="btn" data-act="close-sheet">Annuler</button><button type="button" class="btn primary" id="trSave" data-tr="save" style="flex:2" ${errors().length ? 'disabled' : ''}>${ex ? 'Enregistrer' : '✅ Valider la manche'}</button></div>
    ${ex ? `<div class="btns"><button type="button" class="btn outline-danger" data-tr="delete">🗑 Supprimer cette manche</button></div>` : ''}`;
  const redraw = () => {
    const b = $('#sheetBody');
    const det = $('#trBonus', b); if (det) bonusOpen = det.open;
    b.innerHTML = html();
    const inp = $('#trPts', b);
    inp.oninput = () => { ptsStr = inp.value; $('#trPreview').innerHTML = preview(); $('#trSave').disabled = errors().length > 0; };
    $('#trBonus', b).ontoggle = e => { bonusOpen = e.target.open; };
  };
  openSheet('', b => {
    redraw();
    b.onclick = async e => {
      const el = e.target.closest('[data-tr]'); if (!el) return;
      const k = el.dataset.tr, v = el.dataset.v;
      const tog = (arr, x) => arr.includes(x) ? arr.filter(y => y !== x) : [...arr, x];
      if (k === 'taker'){ const old = R.taker; R.taker = v; if (R.partner === old || R.partner === v) R.partner = null; }
      else if (k === 'partner') R.partner = v;
      else if (k === 'contract') R.contract = v;
      else if (k === 'bouts') R.bouts = +v;
      else if (k === 'petit') R.petit = v;
      else if (k === 'chelem') R.chelem = v;
      else if (k === 'poig') R.poignees[el.dataset.k] = Math.max(0, Math.min(5, R.poignees[el.dataset.k] + +el.dataset.d));
      else if (k === 'mtete') R.miseres.tete = tog(R.miseres.tete, v);
      else if (k === 'matout') R.miseres.atout = tog(R.miseres.atout, v);
      else if (k === 'countdef'){ const a = attPoints(); countDef = !countDef; if (a !== null && !Number.isNaN(a)) ptsStr = String(countDef ? 91 - a : a).replace('.', ','); }
      else if (k === 'delete'){
        if (!(await confirmBox(`Supprimer la manche ${num} ?`, 'Supprimer', true))) return;
        commit('Manche supprimée', () => { t.rounds = t.rounds.filter(x => x.id !== ex.id); }, {render:false});
        closeSheet(); render(); return;
      }
      else if (k === 'save'){
        if (errors().length) return;
        const round = {id: ex ? ex.id : uid(), date: ex ? ex.date : new Date().toISOString(), taker: R.taker, partner: n === 5 ? R.partner : null, contract: R.contract, bouts: R.bouts, points: attPoints(), petit: R.petit || '', poignees: R.poignees, chelem: R.chelem || '', miseres: R.miseres};
        commit(ex ? `Manche ${num} modifiée` : `Manche ${num} enregistrée`, () => {
          const tt = S.tarot.find(x => x.id === sid);
          if (ex){ const i = tt.rounds.findIndex(x => x.id === ex.id); tt.rounds[i] = round; } else tt.rounds.push(round);
        }, {render:false});
        closeSheet(); render(); return;
      }
      redraw();
    };
  });
}

/* ---------- Clôture ---------- */
async function tarotClose(sid){
  const t = S.tarot.find(x => x.id === sid); if (!t || !t.rounds.length) return;
  const tot = tarotTotals(t);
  const order = [...t.pids].sort((a, b) => tot[b] - tot[a]);
  const rank = p => 1 + t.pids.filter(q => tot[q] > tot[p]).length;

/** Statistiques spécifiques Tarot (prises, réussite, contrats). */
function tarotStatsCard(gid){
  const sets = S.matches.filter(m => m.gameId === gid && m.tarot).map(m => m.tarot).concat(S.tarot.filter(t => t.gameId === gid));
  const st = {};
  let nRounds = 0;
  sets.forEach(t => t.rounds.forEach(r => {
    nRounds++;
    const sc = tarotScore(r, t.pids);
    t.pids.forEach(p => { const d = st[p] || (st[p] = {played:0, pts:0, prises:0, ok:0, contracts:{}}); d.played++; d.pts += sc.res[p]; });
    const d = st[r.taker]; d.prises++; if (sc.made) d.ok++; d.contracts[r.contract] = (d.contracts[r.contract] || 0) + 1;
  }));
  if (!nRounds) return '';
  const rows = Object.entries(st).filter(([p]) => P(p)).sort((a, b) => b[1].pts / b[1].played - a[1].pts / a[1].played);
  return `<div class="card"><h2>🃏 Statistiques Tarot <span class="muted small">(${plural(nRounds, 'manche')})</span></h2><div class="tblwrap"><table class="tbl"><tr><th>Joueur</th><th>Manches</th><th>Prises</th><th>Réussite</th><th>Moy.</th></tr>

}

function backupPayload(){ return JSON.stringify({app:'ludiscore', version: APP_VERSION, exportedAt: new Date().toISOString(), data: S}, null, 1); }
function backupName(){ return `ludiscore-sauvegarde-${todayStr()}.json`; }
function download(name, text, type){
  const blob = new Blob([text], {type});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
function markBackup(){ S.settings.lastBackup = new Date().toISOString(); S.settings.matchesAtBackup = S.matches.length; save(); }

    await navigator.share({files:[file], title:'Sauvegarde Ludiscore'});
    markBackup(); toast('Sauvegarde envoyée'); render();
  } catch (e) { if (e && e.name !== 'AbortError') toast('Partage impossible, utilise « Télécharger »'); }
}
function csvCell(v){ v = String(v ?? ''); return /[";\n]/.test(v) ? '"' + v.replace(/"/g, '""') + '"' : v; }
function buildCSV(){
  const rows = [['Date','Heure','Jeu','Catégories','Mode','Joueur','Équipe','Score','Rang','Gagnant','Durée (min)','Notes']];
  sortedMatches().reverse().forEach(m => {
    const g = G(m.gameId) || {name:'?', cats:[]}; const d = new Date(m.date);
    m.results.forEach(r => rows.push([d.toLocaleDateString('fr-FR'), d.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'}), g.name, g.cats.map(c => C(c).name).join(' / '), MODES[m.mode].label, pname(r.pid), r.team || '', m.mode === 'teams' ? (m.teamScores && m.teamScores[r.team] != null ? String(m.teamScores[r.team]).replace('.', ',') : '') : m.mode === 'coop' ? (m.coopScore != null ? m.coopScore : '') : (r.score != null ? String(r.score).replace('.', ',') : ''), m.mode === 'coop' ? '' : r.rank, (m.mode === 'coop' ? m.coopWin : r.rank === 1) ? 'oui' : 'non', m.duration || '', m.notes || '']));
  });
  return rows.map(r => r.map(csvCell).join(';')).join('\r\n');
}
function doExportCSV(){

function startImport(){ const f = $('#importFile'); f.value = ''; f.click(); }
$('#importFile').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = ''; if (!file) return;
  let txt; try { txt = await file.text(); } catch (err) { alertBox('❌ Fichier illisible.'); return; }
  importFromText(txt, 'fichier');
});
async function importFromText(txt, source){
  let data;
  try { const j = JSON.parse(txt); data = j && j.data ? j.data : j; if (!data || !Array.isArray(data.players) || !Array.isArray(data.games) || !Array.isArray(data.matches)) throw 0; }
  catch { alertBox('❌ Ce fichier n’est pas une sauvegarde Ludiscore valide.'); return; }
  const inc = migrate(data);
  const choice = await dialog(`<h2>📥 Sauvegarde trouvée${source === 'GitHub' ? ' sur GitHub' : ''}</h2><p>Elle contient <b>${plural(inc.players.length, 'joueur')}</b>, <b>${plural(inc.games.length, 'jeu', 'jeux')}</b> et <b>${plural(inc.matches.length, 'partie')}</b>.</p>
    <p class="small"><b>Fusionner</b> : ajoute ce qui manque à tes données actuelles (les doublons sont détectés). Idéal pour récupérer les parties notées sur le téléphone d’un ami.<br><b>Remplacer</b> : efface tes données actuelles (${plural(S.matches.length, 'partie')}) et les remplace par la sauvegarde.</p>`,
    [{label:'Annuler', value:null}, {label:'Remplacer', value:'replace', cls:'danger'}, {label:'Fusionner', value:'merge', cls:'primary'}]);
  if (!choice) return;
  if (choice === 'replace'){
    if (!(await confirmBox(`Remplacer toutes tes données actuelles par cette sauvegarde ?`, 'Oui, remplacer', true))) return;
    commit('Sauvegarde restaurée', () => { const keepTheme = S.settings.theme; S = inc; S.settings.welcomed = true; S.settings.theme = keepTheme; S.settings.seedVersion = SEED_VERSION; });
  } else {
    let rep;
    commit('Fusion terminée', () => { rep = mergeData(inc); });
    alertBox(`✅ Fusion terminée :<br>+ ${rep.players} joueur(s), + ${rep.games} jeu(x), + ${rep.matches} partie(s)${rep.skipped ? `<br>${rep.skipped} partie(s) déjà présente(s) ignorée(s)` : ''}.`);
  }
}
function mergeData(inc){
  const rep = {players:0, games:0, matches:0, skipped:0};
  const pMap = {}, gMap = {}, cMap = {};
  inc.customCats.forEach(c => {
    const ex = allCats().find(x => x.id === c.id || norm(x.name) === norm(c.name));
    if (ex) cMap[c.id] = ex.id; else { S.customCats.push(c); cMap[c.id] = c.id; }
  });
  inc.players.forEach(p => {
    const ex = P(p.id) || S.players.find(x => norm(x.name) === norm(p.name));
    if (ex) pMap[p.id] = ex.id; else { S.players.push(p); pMap[p.id] = p.id; rep.players++; }
  });
  inc.games.forEach(g => {
    const ex = G(g.id) || S.games.find(x => norm(x.name) === norm(g.name));
    if (ex) gMap[g.id] = ex.id; else { g.cats = g.cats.map(c => cMap[c] || c); S.games.push(g); gMap[g.id] = g.id; rep.games++; }
  });
  const mp = id => pMap[id] || id;
  const remapRounds = rounds => rounds.map(r => ({...r, taker: mp(r.taker), partner: r.partner ? mp(r.partner) : null, miseres: {tete: ((r.miseres || {}).tete || []).map(mp), atout: ((r.miseres || {}).atout || []).map(mp)}}));
  inc.tarot.forEach(t => { if (S.tarot.find(x => x.id === t.id)) return; S.tarot.push({...t, gameId: gMap[t.gameId] || t.gameId, pids: t.pids.map(mp), rounds: remapRounds(t.rounds)}); });
  inc.games.forEach(g => { const ex = G(gMap[g.id]); if (ex && g.special && !ex.special) ex.special = g.special; });
  inc.groups.forEach(gr => { if (!S.groups.find(x => x.id === gr.id || norm(x.name) === norm(gr.name))) S.groups.push({...gr, pids: gr.pids.map(id => pMap[id] || id)}); });
  const sig = m => m.gameId + '|' + m.date.slice(0, 16) + '|' + m.results.map(r => r.pid + ':' + (r.score ?? '') + (r.win ? 'W' : '') + (r.team || '')).sort().join(',');
  const have = new Set(S.matches.map(sig)); const ids = new Set(S.matches.map(m => m.id));
  inc.matches.forEach(m => {
    const mm = {...m, gameId: gMap[m.gameId] || m.gameId, results: m.results.map(r => ({...r, pid: pMap[r.pid] || r.pid}))};
    if (m.tarot) mm.tarot = {...m.tarot, pids: m.tarot.pids.map(mp), rounds: remapRounds(m.tarot.rounds)};
    if (ids.has(mm.id) || have.has(sig(mm))){ rep.skipped++; return; }
    computeRanks(mm); S.matches.push(mm); have.add(sig(mm)); ids.add(mm.id); rep.matches++;
  });
  return rep;
}

  <h3 style="margin-top:0">🏁 Enregistrer une partie</h3>
  <ul><li>Les <b>jeux récents</b> apparaissent en premier ; tape quelques lettres pour chercher.</li>
  <li>Les joueurs sont triés par nombre de parties. Raccourcis : <b>🔁 Comme la dernière partie</b> et tes <b>📁 groupes</b>.</li>
  <li>Score négatif : touche <b>±</b>. Les égalités sont gérées (deux 1ᵉʳˢ = deux victoires).</li>
  <li>L’<b>aperçu du classement</b> s’affiche en direct : vérifie avant d’enregistrer. Le bouton reste grisé tant qu’il manque quelque chose (la liste des oublis s’affiche).</li>
  <li>L’appli prévient si le nombre de joueurs ne colle pas avec le jeu, si la date est dans le futur ou si la partie ressemble à un <b>doublon</b>.</li>
  <li>La saisie est <b>gardée en brouillon</b> : si tu quittes l’appli en plein milieu, tu la retrouves sur l’accueil.</li>
  <li>Après chaque action, un bandeau <b>« Annuler »</b> apparaît quelques secondes en bas de l’écran.</li>
  <li>Pour <b>corriger</b> une partie : touche-la dans l’historique → ✏️ Modifier. 🔁 Rejouer relance une partie avec le même jeu et les mêmes joueurs.</li></ul>
  </div>

  <div class="card">
  <h3 style="margin-top:0">🃏 Feuille de Tarot</h3>
  <ul><li>Fiche du jeu Tarot → <b>🃏 Feuille de Tarot</b> (ou choisis Tarot dans « ＋ Partie ») → choisis 3, 4 ou 5 joueurs.</li>
  <li>À chaque manche : <b>preneur</b>, <b>joueur appelé</b> (à 5, ou « seul »), <b>contrat</b>, <b>bouts</b> et <b>points de l’attaque</b> (bouton ↔️ si tu as compté les points de la défense). Les scores se calculent tout seuls, avec un aperçu avant de valider.</li>
  <li><b>Annonces & bonus</b> : petit au bout (attaque ou défense), poignées simple/double/triple, chelem (annoncé réussi, non annoncé réussi, annoncé raté), misère de tête et d’atout.</li>
  <li>Calcul (règle FFT) : contrat à faire 56 / 51 / 41 / 36 points selon 0 / 1 / 2 / 3 bouts. Par défenseur : (25 + écart ± 10 petit au bout) × contrat (Petite ×1, Garde ×2, Garde sans ×4, Garde contre ×6), + poignée (20/30/40) pour le camp gagnant, + chelem (+400 / +200 / −200). Le preneur encaisse la somme payée par les défenseurs (à 5 : ⅔ pour le preneur, ⅓ pour l’appelé). Misère : +10 pris à chaque adversaire.</li>
  <li>La partie reste <b>ouverte</b> d’une soirée à l’autre (bandeau sur l’accueil). Touche une manche pour la corriger ou la supprimer.</li>
  <li><b>🏁 Clôturer la partie</b> : enregistre les totaux comme une partie normale (gagnant = plus gros total), comptée dans toutes les stats. Une partie clôturée peut être <b>rouverte</b> depuis l’historique.</li>

  </div>

  <div class="card">
  <h3 style="margin-top:0">📊 Les statistiques</h3>
  <p>Filtres communs en haut : période, catégorie, jeu.</p>
  <ul><li><b>🏆 Classement</b> : % de victoires de chacun (avec un minimum de parties réglable). La barre est colorée selon les catégories des jeux gagnés.</li>
  <li><b>👥 Groupe</b> : choisis A, B et C → qui gagne le plus quand ils jouent ensemble, et qui domine sur chaque jeu. « Exactement ce groupe » = seulement les parties sans personne d’autre.</li>
  <li><b>⚔️ Face-à-face</b> : A contre B, qui finit devant l’autre le plus souvent, jeu par jeu. Plus une matrice « qui bat qui » et les meilleurs duos en équipe.</li>

  <li><b>Fiche joueur</b> (touche un nom) : forme récente, séries, point fort, bête noire, victime préférée…</li></ul>
  <div class="tip"><b>Performance</b> = part moyenne des adversaires battus (100 % = toujours 1ᵉʳ).<br><b>Indice vs hasard</b> = victoires ÷ victoires attendues si tout le monde avait le même niveau. ×1,5 = 50 % de victoires de plus que la moyenne.</div>
  </div>

  <div class="card">

/* =========================================================
   SAUVEGARDE SUR GITHUB
   Le jeton GitHub et la configuration restent sur ce téléphone
   (clé séparée, jamais incluse dans les fichiers de sauvegarde).
   Seuls ludiscore-sauvegarde.json (joueurs, jeux, parties) et

   ========================================================= */
const GH_KEY = 'ludiscore.github.v1';
const GH_DIRTY = 'ludiscore.ghdirty.v1';
const GH_FILES = {json:'ludiscore-sauvegarde.json', csv:'historique-parties.csv'};
function ghCfg(){
  const d = {owner:'', repo:'', branch:'main', dir:'', token:'', auto:true, lastOk:null, lastCount:0, lastErr:null};
  try { return Object.assign(d, JSON.parse(localStorage.getItem(GH_KEY)) || {}); } catch (e) { return d; }
}
function ghSetCfg(c){ try { localStorage.setItem(GH_KEY, JSON.stringify(c)); } catch (e) {} }
const ghReady = c => !!(c.owner && c.repo && c.token);
const ghPath = (c, name) => (c.dir ? c.dir.split('/').filter(Boolean).map(encodeURIComponent).join('/') + '/' : '') + encodeURIComponent(name);
const ghWebUrl = c => `https://github.com/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${c.dir ? '/tree/' + encodeURIComponent(c.branch) + '/' + c.dir : ''}`;
function toB64(str){
  const bytes = new TextEncoder().encode(str); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
async function ghFetch(c, path, opts = {}){
  let r;
  try {
    r = await fetch(`https://api.github.com/repos/${encodeURIComponent(c.owner)}/${encodeURIComponent(c.repo)}${path}`, {
      method: opts.method || 'GET', cache: 'no-store',
      headers: Object.assign({'Accept': opts.accept || 'application/vnd.github+json', 'Authorization': 'Bearer ' + c.token, 'X-GitHub-Api-Version': '2022-11-28'}, opts.body ? {'Content-Type': 'application/json'} : {}),
      body: opts.body});
  } catch (e) { throw new Error('Pas de connexion internet (ou GitHub injoignable).'); }
  return r;
}
async function ghErrMsg(r){
  let detail = ''; try { detail = (await r.json()).message || ''; } catch (e) {}
  if (r.status === 401) return 'Jeton invalide ou expiré : crée un nouveau jeton et colle-le dans la configuration.';
  if (r.status === 403) return 'Accès refusé : le jeton doit avoir la permission « Contents : Read and write » sur ce dépôt.' + (detail ? ` (${detail})` : '');
  if (r.status === 404) return 'Dépôt, branche ou fichier introuvable. Vérifie le pseudo, le nom du dépôt, la branche, et que le jeton a bien accès à ce dépôt.';
  if (r.status === 409) return 'Conflit avec GitHub : réessaie dans quelques secondes.';
  if (r.status === 422) return 'GitHub a refusé l’envoi (dépôt vide ou branche inexistante ?).' + (detail ? ` (${detail})` : '');
  return `Erreur GitHub ${r.status}${detail ? ' : ' + detail : ''}`;
}
async function ghPutFile(c, name, content, message){
  const p = '/contents/' + ghPath(c, name);
  let sha;
  const g = await ghFetch(c, p + '?ref=' + encodeURIComponent(c.branch));
  if (g.ok) sha = (await g.json()).sha;
  else if (g.status !== 404) throw new Error(await ghErrMsg(g));
  const body = {message, content: toB64(content), branch: c.branch};
  if (sha) body.sha = sha;
  const r = await ghFetch(c, p, {method:'PUT', body: JSON.stringify(body)});
  if (!r.ok) throw new Error(await ghErrMsg(r));
}
let ghBusy = false, ghTimer = null;
function ghMarkDirty(){ try { localStorage.setItem(GH_DIRTY, String(Date.now())); } catch (e) {} ghSchedule(); }
function ghSchedule(delay = 30000){
  const c = ghCfg();
  if (!ghReady(c) || !c.auto) return;
  clearTimeout(ghTimer);
  ghTimer = setTimeout(() => ghPush(false), delay);
}
const ghIsDirty = () => !!localStorage.getItem(GH_DIRTY);
async function ghPush(manual){
  const c = ghCfg();
  if (!ghReady(c)){ if (manual) ghConfigForm(); return false; }
  if (ghBusy){ if (manual) toast('Envoi déjà en cours…'); return false; }
  ghBusy = true; clearTimeout(ghTimer);
  const start = Date.now();
  if (manual) toast('Envoi vers GitHub…');
  let ok = false;
  try {
    const when = new Date();
    const msg = `Sauvegarde Ludiscore · ${when.toLocaleDateString('fr-FR')} ${when.toLocaleTimeString('fr-FR', {hour:'2-digit', minute:'2-digit'})} · ${plural(S.matches.length, 'partie')}`;
    await ghPutFile(c, GH_FILES.json, backupPayload(), msg);
    await ghPutFile(c, GH_FILES.csv, '﻿' + buildCSV(), msg);
    const c2 = ghCfg(); c2.lastOk = when.toISOString(); c2.lastCount = S.matches.length; c2.lastErr = null; ghSetCfg(c2);
    if ((+localStorage.getItem(GH_DIRTY) || 0) <= start) localStorage.removeItem(GH_DIRTY); else ghSchedule();
    ok = true;
    if (manual) toast('Sauvegarde envoyée sur GitHub ✅');
  } catch (e) {
    const c2 = ghCfg(); c2.lastErr = {msg: e.message || String(e), at: new Date().toISOString()}; ghSetCfg(c2);
    if (manual) alertBox('❌ Envoi impossible : ' + esc(c2.lastErr.msg));
  } finally {
    ghBusy = false;
    const rn = parseHash().name; if ((rn === 'settings' || rn === 'home') && !sheetOpen) render();
  }
  return ok;
}
async function ghRestore(){
  const c = ghCfg(); if (!ghReady(c)) return ghConfigForm();
  toast('Lecture de la sauvegarde sur GitHub…');
  try {
    const r = await ghFetch(c, '/contents/' + ghPath(c, GH_FILES.json) + '?ref=' + encodeURIComponent(c.branch), {accept:'application/vnd.github.raw+json'});
    if (!r.ok){ alertBox('❌ ' + esc(r.status === 404 ? 'Aucune sauvegarde trouvée sur GitHub pour l’instant (fais d’abord un envoi).' : await ghErrMsg(r))); return; }
    await importFromText(await r.text(), 'GitHub');
  } catch (e) { alertBox('❌ ' + esc(e.message || String(e))); }
}
function ghStatusHtml(c){
  if (!ghReady(c)) return `<p class="small" style="margin:0">Envoie automatiquement tes sauvegardes (joueurs, jeux, parties) dans un dépôt GitHub : tu gardes un historique de toutes les versions, consultable depuis n’importe où. Le guide (bouton ?) explique comment créer le dépôt et le jeton.</p>`;
  let s = `<div class="small">📁 <a href="${ghWebUrl(c)}" target="_blank" rel="noopener">${esc(c.owner)}/${esc(c.repo)}</a>${c.dir ? ' · dossier ' + esc(c.dir) : ''} · branche ${esc(c.branch)}</div>`;
  if (c.lastOk) s += `<div class="small" style="margin-top:4px">✅ Dernier envoi : <b>${fmtDateShort(c.lastOk)}</b> (${plural(c.lastCount, 'partie')})</div>`;
  else s += `<div class="small muted" style="margin-top:4px">Aucun envoi pour l’instant.</div>`;
  if (c.lastErr && (!c.lastOk || c.lastErr.at > c.lastOk)) s += `<div class="hint err">⚠️ Dernier essai raté (${fmtDateShort(c.lastErr.at)}) : ${esc(c.lastErr.msg)}</div>`;
  if (ghIsDirty() && c.lastOk) s += `<div class="small muted" style="margin-top:2px">⏳ Des modifications ne sont pas encore envoyées${c.auto ? ' (envoi automatique dès que possible)' : ''}.</div>`;
  return s;
}
function ghConfigForm(){
  const c = ghCfg();
  openSheet(`<h2>☁️ Sauvegarde sur GitHub</h2>
    <p class="small muted" style="margin:0">Le jeton reste uniquement sur ce téléphone : il n’est jamais mis dans les sauvegardes ni envoyé ailleurs qu’à GitHub.</p>
    <label class="f">Ton pseudo GitHub *<input type="text" id="ghOwner" value="${esc(c.owner)}" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="ex : theo-b"></label>
    <label class="f">Nom du dépôt *<input type="text" id="ghRepo" value="${esc(c.repo || 'ludiscore-sauvegardes')}" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
    <div class="two"><label class="f">Branche<input type="text" id="ghBranch" value="${esc(c.branch || 'main')}" autocapitalize="off" spellcheck="false"></label><label class="f">Dossier (facultatif)<input type="text" id="ghDir" value="${esc(c.dir)}" autocapitalize="off" spellcheck="false" placeholder="à la racine"></label></div>
    <label class="f">Jeton d’accès (fine-grained) *<input type="password" id="ghToken" value="" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="${c.token ? '•••••••• déjà enregistré (laisser vide pour le garder)' : 'github_pat_…'}"></label>
    <div class="hint" id="ghTokHint"></div>
    <label class="row small" style="margin-top:14px;gap:10px;align-items:flex-start"><input type="checkbox" id="ghAuto" ${c.auto ? 'checked' : ''} style="width:20px;height:20px;flex:none;accent-color:var(--primary)"><span><b>Envoi automatique</b><br><span class="muted">≈ 30 secondes après chaque modification (partie, manche, joueur…), ou à la prochaine ouverture s’il n’y avait pas internet.</span></span></label>
    <div id="ghMsg"></div>
    <div class="btns"><button class="btn" data-act="close-sheet">Annuler</button><button class="btn primary" id="ghTest" style="flex:2">Tester et enregistrer</button></div>
    ${ghReady(c) ? `<div class="btns"><button class="btn outline-danger" id="ghForget">Oublier la configuration et le jeton</button></div>` : ''}`, b => {
    const tok = $('#ghToken', b), hint = $('#ghTokHint', b);
    tok.oninput = () => {
      const v = tok.value.trim();
      if (v.startsWith('ghp_')){ hint.className = 'hint warn'; hint.textContent = 'Jeton « classique » : il donne accès à tous tes dépôts. Préfère un jeton fine-grained (github_pat_…) limité au dépôt de sauvegarde.'; }
      else hint.textContent = '';
    };
    $('#ghTest', b).onclick = async () => {
      const n = {...c, owner: $('#ghOwner', b).value.trim().replace(/^@/, ''), repo: $('#ghRepo', b).value.trim(), branch: $('#ghBranch', b).value.trim() || 'main', dir: $('#ghDir', b).value.trim().replace(/^\/+|\/+$/g, ''), auto: $('#ghAuto', b).checked};
      if (tok.value.trim()) n.token = tok.value.trim();
      const bad = !/^[A-Za-z0-9-]+$/.test(n.owner) ? 'Pseudo GitHub invalide.' : !/^[A-Za-z0-9._-]+$/.test(n.repo) ? 'Nom de dépôt invalide.' : !n.token ? 'Colle ton jeton d’accès.' : '';
      const msg = $('#ghMsg', b);
      if (bad){ msg.innerHTML = `<div class="hint err">${esc(bad)}</div>`; return; }
      msg.innerHTML = `<div class="hint muted">Connexion à GitHub…</div>`;
      try {
        const r = await ghFetch(n, '');
        if (!r.ok){ msg.innerHTML = `<div class="hint err">${esc(await ghErrMsg(r))}</div>`; return; }
        const repo = await r.json();
        n.lastErr = null;
        ghSetCfg(n);
        closeSheet();
        render();
        const first = await confirmBox(`✅ Connecté au dépôt <b>${esc(repo.full_name)}</b> (${repo.private ? 'privé' : 'public'}).<br><br>Envoyer une première sauvegarde maintenant ?`, 'Envoyer', false, 'GitHub configuré');
        if (first) ghPush(true);
      } catch (e) { msg.innerHTML = `<div class="hint err">${esc(e.message || String(e))}</div>`; }
    };
    const fg = $('#ghForget', b);
    if (fg) fg.onclick = async () => {
      if (!(await confirmBox('Supprimer la configuration GitHub et le jeton de ce téléphone ? (Les sauvegardes déjà envoyées restent sur GitHub.)', 'Oublier', true))) return;
      localStorage.removeItem(GH_KEY); localStorage.removeItem(GH_DIRTY); clearTimeout(ghTimer);
      closeSheet(); render(); toast('Configuration GitHub supprimée');
    };
  });
}
window.addEventListener('online', () => { if (ghIsDirty()) ghSchedule(3000); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && ghIsDirty() && ghReady(ghCfg()) && ghCfg().auto && !ghBusy) ghPush(false); });

/* ---------- Données de démonstration ---------- */
function loadDemo(){
  const mk = (name, color, emoji) => ({id: uid(), name, color, emoji, demo: true, createdAt: Date.now()});
  const pl = [mk('Alice', COLORS[0], '🦊'), mk('Bastien', COLORS[1], '🐻'), mk('Chloé', COLORS[2], '🦉'), mk('David', COLORS[3], ''), mk('Emma', COLORS[4], '🐙'), mk('Félix', COLORS[5], '')];
  const skill = [1.3, 1.0, 1.15, 0.8, 1.05, 0.9];
  const newGames = [];
  const gm = (name, cats, mode, min, max) => {
    const ex = S.games.find(g => !g.archived && g.mode === mode && norm(g.name) === norm(name));
    if (ex) return ex; // réutilise tes jeux existants
    const g = {id: uid(), name: name + ' (démo)', cats, mode, min, max, img: null, notes: '', demo: true, createdAt: Date.now()};
    newGames.push(g); return g;
  };
  const gs = [gm('Skyjo', ['cartes', 'familial'], 'low', 2, 8), gm('Ark Nova', ['strategie', 'gestion'], 'high', 1, 4), gm('Codenames', ['ambiance', 'mots'], 'teams', 4, 8), gm('Mindbug', ['duel', 'cartes'], 'winner', 2, 2), gm('Hanabi', ['coop', 'cartes'], 'coop', 2, 5), gm('Château Combo', ['cartes', 'gestion'], 'high', 2, 5), gm('Tarot', ['plis', 'cartes'], 'high', 3, 5), gm('Flip 7', ['cartes', 'des'], 'high', 3, 8)];
  S.players.push(...pl); S.games.push(...newGames);
  S.groups.push({id: uid(), name: 'Coloc (démo)', pids: [pl[0].id, pl[1].id, pl[2].id], demo: true});
  let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  const pick = (arr, k) => { const a = [...arr]; const o = []; while (o.length < k && a.length) o.push(a.splice(Math.floor(rnd() * a.length), 1)[0]); return o; };
  for (let i = 0; i < 80; i++){
    const g = gs[Math.floor(rnd() * gs.length)];
    const n = g.mode === 'winner' ? 2 : g.mode === 'teams' ? 4 + Math.floor(rnd() * 2) * 2 : Math.max(Math.max(g.min || 2, 2), Math.min(g.max || 5, 2 + Math.floor(rnd() * 4)));
    const ps = pick(pl.map((p, ix) => ix), n);
    const date = new Date(Date.now() - rnd() * 300 * 864e5); date.setHours(18 + Math.floor(rnd() * 5), Math.floor(rnd() * 60));
    const m = {id: uid(), gameId: g.id, mode: g.mode, date: date.toISOString(), duration: Math.round(15 + rnd() * 90), notes: '', demo: true, createdAt: Date.now() + i};
    const perf = ix => skill[ix] * (0.6 + rnd());
    if (g.mode === 'high') m.results = ps.map(ix => ({pid: pl[ix].id, score: Math.round(perf(ix) * (g.name.startsWith('Ark') ? 30 : 40))}));
    else if (g.mode === 'low') m.results = ps.map(ix => ({pid: pl[ix].id, score: Math.round(90 / perf(ix) - 20)}));
    else if (g.mode === 'winner'){ const w = perf(ps[0]) > perf(ps[1]) ? 0 : 1; m.results = ps.map((ix, k) => ({pid: pl[ix].id, win: k === w})); }
    else if (g.mode === 'teams'){ m.results = ps.map((ix, k) => ({pid: pl[ix].id, team: k % 2 ? 'B' : 'A'})); const sa = ps.filter((_, k) => !(k % 2)).reduce((s, ix) => s + perf(ix), 0), sb = ps.filter((_, k) => k % 2).reduce((s, ix) => s + perf(ix), 0); m.teamScores = {A: null, B: null}; m.winTeam = sa >= sb ? 'A' : 'B'; }
    else { m.results = ps.map(ix => ({pid: pl[ix].id})); m.coopWin = rnd() < .55; m.coopScore = Math.round(10 + rnd() * 15); }
    computeRanks(m); S.matches.push(m);
  }
}
